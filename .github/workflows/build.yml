name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Signing key
        run: |
          if [ ! -s debug.keystore ]; then
            rm -f debug.keystore
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "build"
            git config user.email "build@example.com"
            git add debug.keystore
            git commit -m "Add signing key"
            git push
          fi
          ls -l debug.keystore
      - name: Prepare
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init LinkBox com.shans.linkbox2 --web-dir=www
          npx cap add android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.${{ github.run_number }}"/' android/app/build.gradle
          mkdir -p assets
          cp icon.jpg assets/icon-only.jpg
          cp icon.jpg assets/icon-foreground.jpg
          cp icon.jpg assets/icon-background.jpg
          npm i -D @capacitor/assets
          npx capacitor-assets generate --android
          python3 - <<'PY'
          p = 'www/index.html'
          s = open(p, encoding='utf-8').read()
          js = '''<script>
          window.addEventListener("load", function () { setTimeout(function () { window.__shareReady = true; }, 800); });
          window.receiveShared = function (t) {
            try {
              if (!window.__shareReady || typeof window.addLinkByAI !== "function") return false;
              var i = document.getElementById("url-input");
              if (!i) return false;
              i.value = t;
              window.addLinkByAI();
              return true;
            } catch (e) { return false; }
          };
          </script>'''
          s = s.replace('</body>', js + '</body>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          m = 'android/app/src/main/AndroidManifest.xml'
          x = open(m, encoding='utf-8').read()
          f = '<intent-filter><action android:name="android.intent.action.SEND" /><category android:name="android.intent.category.DEFAULT" /><data android:mimeType="text/plain" /></intent-filter>'
          x = x.replace('</activity>', f + '</activity>', 1)
          open(m, 'w', encoding='utf-8').write(x)
          PY
          cat > android/app/src/main/java/com/shans/linkbox2/MainActivity.java <<'JAVA'
          package com.shans.linkbox2;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import androidx.activity.OnBackPressedCallback;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              if (getBridge() != null && getBridge().getWebView() != null) {
                getBridge().getWebView().addJavascriptInterface(new LinkBoxBridge(), "LinkBoxNative");
              }
              handleShare(getIntent());
              getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                @Override
                public void handleOnBackPressed() {
                  if (getBridge() != null && getBridge().getWebView() != null) {
                    getBridge().getWebView().evaluateJavascript(
                      "(function(){ return window.onBackPressed ? window.onBackPressed() : 'exit'; })()",
                      new android.webkit.ValueCallback<String>() {
                        @Override
                        public void onReceiveValue(String value) {
                          if ("\"exit\"".equals(value) || "null".equals(value)) {
                            finish();
                          }
                        }
                      }
                    );
                  } else {
                    finish();
                  }
                }
              });
            }

            public class LinkBoxBridge {
              @JavascriptInterface
              public String exportFile(String filename, String content, String mimeType) {
                try {
                  byte[] bytes = content.getBytes(StandardCharsets.UTF_8);
                  Uri savedUri = null;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                    ContentValues values = new ContentValues();
                    values.put(MediaStore.Downloads.DISPLAY_NAME, filename);
                    values.put(MediaStore.Downloads.MIME_TYPE, mimeType);
                    values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                    savedUri = getContentResolver().insert(MediaStore.Downloads.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY), values);
                    if (savedUri != null) {
                      try (OutputStream os = getContentResolver().openOutputStream(savedUri)) {
                        if (os != null) os.write(bytes);
                      }
                    }
                  } else {
                    File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                    if (!dir.exists()) dir.mkdirs();
                    File outFile = new File(dir, filename);
                    try (FileOutputStream fos = new FileOutputStream(outFile)) {
                      fos.write(bytes);
                    }
                  }

                  File cacheFile = new File(getCacheDir(), filename);
                  try (FileOutputStream fos = new FileOutputStream(cacheFile)) {
                    fos.write(bytes);
                  }
                  Uri shareUri = FileProvider.getUriForFile(MainActivity.this, getPackageName() + ".fileprovider", cacheFile);
                  Intent shareIntent = new Intent(Intent.ACTION_SEND);
                  shareIntent.setType(mimeType);
                  shareIntent.putExtra(Intent.EXTRA_STREAM, shareUri);
                  shareIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  startActivity(Intent.createChooser(shareIntent, filename));
                  return filename;
                } catch (Exception e) {
                  return "";
                }
              }
            }

            @Override
            protected void onNewIntent(Intent intent) {
              super.onNewIntent(intent);
              setIntent(intent);
              handleShare(intent);
            }
            private void handleShare(Intent intent) {
              if (intent == null || !Intent.ACTION_SEND.equals(intent.getAction())) return;
              String text = intent.getStringExtra(Intent.EXTRA_TEXT);
              if (text == null || text.isEmpty()) return;
              intent.removeExtra(Intent.EXTRA_TEXT);
              trySend(JSONObject.quote(text), 0);
            }
            private void trySend(final String quoted, final int attempt) {
              new Handler(Looper.getMainLooper()).postDelayed(new Runnable() {
                @Override
                public void run() {
                  if (getBridge() == null || getBridge().getWebView() == null) {
                    if (attempt < 30) trySend(quoted, attempt + 1);
                    return;
                  }
                  getBridge().getWebView().evaluateJavascript(
                    "(function(){return window.receiveShared ? window.receiveShared(" + quoted + ") : false;})()",
                    new android.webkit.ValueCallback<String>() {
                      @Override
                      public void onReceiveValue(String value) {
                        if (!"true".equals(value) && attempt < 30) trySend(quoted, attempt + 1);
                      }
                    });
                }
              }, 500);
            }
          }
          JAVA
          npx cap sync android
      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Sign APK
        run: |
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $BT/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --v4-signing-enabled false --out LinkBox.apk android/app/build/outputs/apk/debug/app-debug.apk
          $BT/apksigner verify --print-certs LinkBox.apk | grep "SHA-256"
          $BT/aapt2 dump badging LinkBox.apk | head -1
      - uses: actions/upload-artifact@v4
        with:
          name: LinkBox
          path: LinkBox.apk
