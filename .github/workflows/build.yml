name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APK: LinkBox-v1.${{ github.run_number }}.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.npm
          key: deps-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: deps-${{ runner.os }}-
      - name: Signing key
        run: |
          if [ ! -s debug.keystore ]; then
            rm -f debug.keystore
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "build"
            git config user.email "build@example.com"
            git add debug.keystore
            git commit -m "Add signing key"
            git push
          fi
          ls -l debug.keystore
      - name: Prepare
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init LinkBox com.shans.linkbox2 --web-dir=www
          npx cap add android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.${{ github.run_number }}"/' android/app/build.gradle
          mkdir -p assets
          cp icon.jpg assets/icon-only.jpg
          cp icon.jpg assets/icon-foreground.jpg
          cp icon.jpg assets/icon-background.jpg
          npm i -D @capacitor/assets
          npx capacitor-assets generate --android
          python3 - <<'PY'
          p = 'www/index.html'
          s = open(p, encoding='utf-8').read()
          js = '''<script>
          window.__LINKBOX_BUILD__ = "v1.${{ github.run_number }}";
          window.addEventListener("load", function () { setTimeout(function () { window.__shareReady = true; }, 800); });
          window.receiveShared = function (t) {
            try {
              if (!window.__shareReady || typeof window.addLinkByAI !== "function") return false;
              var i = document.getElementById("url-input");
              if (!i) return false;
              i.value = t;
              window.addLinkByAI();
              return true;
            } catch (e) { return false; }
          };
          </script>'''
          s = s.replace('</body>', js + '</body>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          m = 'android/app/src/main/AndroidManifest.xml'
          x = open(m, encoding='utf-8').read()
          f = '<intent-filter><action android:name="android.intent.action.SEND" /><category android:name="android.intent.category.DEFAULT" /><data android:mimeType="text/plain" /></intent-filter>'
          x = x.replace('</activity>', f + '</activity>', 1)
          open(m, 'w', encoding='utf-8').write(x)
          PY
          cat > android/app/src/main/java/com/shans/linkbox2/MainActivity.java <<'JAVA'
          package com.shans.linkbox2;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.text.Html;
          import android.webkit.JavascriptInterface;
          import androidx.activity.OnBackPressedCallback;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.BridgeActivity;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
            private final ExecutorService netPool = Executors.newFixedThreadPool(4);

            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              if (getBridge() != null && getBridge().getWebView() != null) {
                getBridge().getWebView().addJavascriptInterface(new LinkBoxBridge(), "LinkBoxNative");
              }
              handleShare(getIntent());
              getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                @Override
                public void handleOnBackPressed() {
                  if (getBridge() != null && getBridge().getWebView() != null) {
                    getBridge().getWebView().evaluateJavascript(
                      "(function(){ return window.onBackPressed ? window.onBackPressed() : 'exit'; })()",
                      new android.webkit.ValueCallback<String>() {
                        @Override
                        public void onReceiveValue(String value) {
                          if ("\"exit\"".equals(value) || "null".equals(value)) {
                            finish();
                          }
                        }
                      }
                    );
                  } else {
                    finish();
                  }
                }
              });
            }

            public class LinkBoxBridge {
              @JavascriptInterface
              public String exportFile(String filename, String content, String mimeType) {
                try {
                  byte[] bytes = content.getBytes(StandardCharsets.UTF_8);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                    ContentValues values = new ContentValues();
                    values.put(MediaStore.Downloads.DISPLAY_NAME, filename);
                    values.put(MediaStore.Downloads.MIME_TYPE, mimeType);
                    values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                    Uri savedUri = getContentResolver().insert(MediaStore.Downloads.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY), values);
                    if (savedUri != null) {
                      try (OutputStream os = getContentResolver().openOutputStream(savedUri)) {
                        if (os != null) os.write(bytes);
                      }
                    }
                  } else {
                    File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                    if (!dir.exists()) dir.mkdirs();
                    try (FileOutputStream fos = new FileOutputStream(new File(dir, filename))) {
                      fos.write(bytes);
                    }
                  }

                  File cacheFile = new File(getCacheDir(), filename);
                  try (FileOutputStream fos = new FileOutputStream(cacheFile)) {
                    fos.write(bytes);
                  }
                  Uri shareUri = FileProvider.getUriForFile(MainActivity.this, getPackageName() + ".fileprovider", cacheFile);
                  Intent shareIntent = new Intent(Intent.ACTION_SEND);
                  shareIntent.setType(mimeType);
                  shareIntent.putExtra(Intent.EXTRA_STREAM, shareUri);
                  shareIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  startActivity(Intent.createChooser(shareIntent, filename));
                  return filename;
                } catch (Exception e) {
                  return "";
                }
              }

              @JavascriptInterface
              public void fetchPageMeta(final String reqId, final String targetUrl) {
                netPool.execute(new Runnable() {
                  @Override
                  public void run() {
                    String title = "";
                    String desc = "";
                    HttpURLConnection conn = null;
                    try {
                      String currentUrl = targetUrl;
                      for (int redirects = 0; redirects < 4; redirects++) {
                        URL url = new URL(currentUrl);
                        conn = (HttpURLConnection) url.openConnection();
                        conn.setInstanceFollowRedirects(false);
                        conn.setConnectTimeout(6500);
                        conn.setReadTimeout(6500);
                        conn.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36");
                        conn.setRequestProperty("Accept", "text/html,application/xhtml+xml");
                        conn.setRequestProperty("Accept-Language", "uk-UA,uk;q=0.9,en;q=0.8");
                        int code = conn.getResponseCode();
                        if (code >= 300 && code < 400) {
                          String loc = conn.getHeaderField("Location");
                          conn.disconnect();
                          if (loc == null || loc.isEmpty()) break;
                          currentUrl = new URL(url, loc).toString();
                          continue;
                        }
                        break;
                      }

                      if (conn != null && conn.getResponseCode() >= 200 && conn.getResponseCode() < 300) {
                        String cType = conn.getContentType();
                        String charset = "UTF-8";
                        if (cType != null) {
                          Matcher cm = Pattern.compile("charset=([^;\\s]+)", Pattern.CASE_INSENSITIVE).matcher(cType);
                          if (cm.find()) charset = cm.group(1).replace("\"", "").trim();
                        }
                        InputStream is = conn.getInputStream();
                        ByteArrayOutputStream baos = new ByteArrayOutputStream();
                        byte[] buf = new byte[4096];
                        int n, total = 0;
                        while ((n = is.read(buf)) != -1 && total < 163840) {
                          baos.write(buf, 0, n);
                          total += n;
                        }
                        is.close();
                        String html = baos.toString(charset);

                        title = extractMeta(html, "(?:property|name)\\s*=\\s*[\"'](?:og:title|twitter:title)[\"']");
                        if (title.isEmpty()) {
                          Matcher tm = Pattern.compile("<title[^>]*>(.*?)</title>", Pattern.CASE_INSENSITIVE | Pattern.DOTALL).matcher(html);
                          if (tm.find()) title = cleanHtmlText(tm.group(1));
                        }

                        desc = extractMeta(html, "(?:name|property)\\s*=\\s*[\"'](?:description|og:description|twitter:description)[\"']");
                      }
                    } catch (Exception ignored) {
                    } finally {
                      if (conn != null) conn.disconnect();
                    }

                    final String jsCall = "window.__onNativePageMeta && window.__onNativePageMeta("
                      + JSONObject.quote(reqId) + ","
                      + JSONObject.quote(title) + ","
                      + JSONObject.quote(desc) + ");";
                    runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                        if (getBridge() != null && getBridge().getWebView() != null) {
                          getBridge().getWebView().evaluateJavascript(jsCall, null);
                        }
                      }
                    });
                  }
                });
              }

              @JavascriptInterface
              public void httpRequest(final String reqId, final String method, final String url, final String headersJson, final String body) {
                netPool.execute(new Runnable() {
                  @Override
                  public void run() {
                    int status = 0;
                    String text = "";
                    HttpURLConnection conn = null;
                    try {
                      conn = (HttpURLConnection) new URL(url).openConnection();
                      conn.setRequestMethod(method);
                      conn.setConnectTimeout(15000);
                      conn.setReadTimeout(30000);
                      JSONObject h = new JSONObject(headersJson);
                      java.util.Iterator<String> it = h.keys();
                      while (it.hasNext()) {
                        String k = it.next();
                        conn.setRequestProperty(k, h.getString(k));
                      }
                      if (body != null && !body.isEmpty()) {
                        conn.setDoOutput(true);
                        try (OutputStream os = conn.getOutputStream()) {
                          os.write(body.getBytes(StandardCharsets.UTF_8));
                        }
                      }
                      status = conn.getResponseCode();
                      InputStream is = status >= 400 ? conn.getErrorStream() : conn.getInputStream();
                      if (is != null) {
                        ByteArrayOutputStream baos = new ByteArrayOutputStream();
                        byte[] buf = new byte[4096];
                        int n, total = 0;
                        while ((n = is.read(buf)) != -1 && total < 1048576) {
                          baos.write(buf, 0, n);
                          total += n;
                        }
                        is.close();
                        text = baos.toString("UTF-8");
                      }
                    } catch (Exception e) {
                      text = "ERR:" + e.getClass().getSimpleName() + ": " + String.valueOf(e.getMessage());
                    } finally {
                      if (conn != null) conn.disconnect();
                    }
                    final String js = "window.__onNativeHttp && window.__onNativeHttp(" + JSONObject.quote(reqId) + "," + status + "," + JSONObject.quote(text) + ");";
                    runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                        if (getBridge() != null && getBridge().getWebView() != null) {
                          getBridge().getWebView().evaluateJavascript(js, null);
                        }
                      }
                    });
                  }
                });
              }

              private String extractMeta(String html, String attrPattern) {
                Pattern p1 = Pattern.compile("<meta[^>]*?" + attrPattern + "[^>]*?content\\s*=\\s*[\"'](.*?)[\"'][^>]*?>", Pattern.CASE_INSENSITIVE | Pattern.DOTALL);
                Matcher m1 = p1.matcher(html);
                if (m1.find()) return cleanHtmlText(m1.group(1));
                Pattern p2 = Pattern.compile("<meta[^>]*?content\\s*=\\s*[\"'](.*?)[\"'][^>]*?" + attrPattern + "[^>]*?>", Pattern.CASE_INSENSITIVE | Pattern.DOTALL);
                Matcher m2 = p2.matcher(html);
                if (m2.find()) return cleanHtmlText(m2.group(1));
                return "";
              }

              private String cleanHtmlText(String raw) {
                if (raw == null) return "";
                String stripped = raw.replaceAll("<[^>]+>", " ");
                String decoded = Html.fromHtml(stripped, Html.FROM_HTML_MODE_LEGACY).toString();
                return decoded.replaceAll("\\s+", " ").trim();
              }
            }

            @Override
            protected void onNewIntent(Intent intent) {
              super.onNewIntent(intent);
              setIntent(intent);
              handleShare(intent);
            }
            private void handleShare(Intent intent) {
              if (intent == null || !Intent.ACTION_SEND.equals(intent.getAction())) return;
              String text = intent.getStringExtra(Intent.EXTRA_TEXT);
              if (text == null || text.isEmpty()) return;
              intent.removeExtra(Intent.EXTRA_TEXT);
              trySend(JSONObject.quote(text), 0);
            }
            private void trySend(final String quoted, final int attempt) {
              new Handler(Looper.getMainLooper()).postDelayed(new Runnable() {
                @Override
                public void run() {
                  if (getBridge() == null || getBridge().getWebView() == null) {
                    if (attempt < 30) trySend(quoted, attempt + 1);
                    return;
                  }
                  getBridge().getWebView().evaluateJavascript(
                    "(function(){return window.receiveShared ? window.receiveShared(" + quoted + ") : false;})()",
                    new android.webkit.ValueCallback<String>() {
                      @Override
                      public void onReceiveValue(String value) {
                        if (!"true".equals(value) && attempt < 30) trySend(quoted, attempt + 1);
                      }
                    });
                }
              }, 500);
            }
          }
          JAVA
          npx cap sync android
      - name: Build
        run: |
          cd android
          chmod +x gradlew
          for i in 1 2 3; do ./gradlew assembleDebug && break || sleep 15; done
          ls app/build/outputs/apk/debug/app-debug.apk
      - name: Sign APK
        run: |
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $BT/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --v4-signing-enabled false --out "$APK" android/app/build/outputs/apk/debug/app-debug.apk
          $BT/apksigner verify --print-certs "$APK" | grep "SHA-256"
          $BT/aapt2 dump badging "$APK" | head -1
      - name: Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" "$APK" --title "LinkBox v1.${{ github.run_number }}" --notes "Збірка #${{ github.run_number }}" --latest --target "${{ github.sha }}"
          gh release list --limit 200 --json tagName -q '.[10:][].tagName' | while read t; do gh release delete "$t" --cleanup-tag -y; done
      - name: Save zip to releases folder
        continue-on-error: true
        run: |
          mkdir -p releases
          zip -j "releases/LinkBox-v1.${{ github.run_number }}.zip" "$APK"
          ls -1t releases/LinkBox-v1.*.zip | tail -n +6 | xargs -r git rm -f --quiet
          git config user.name "build"
          git config user.email "build@example.com"
          git add releases
          git commit -m "LinkBox v1.${{ github.run_number }}"
          git pull --rebase
          git push
      - name: Telegram
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT_ID }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL_ID }}
          TG_THREAD: ${{ secrets.TG_THREAD_ID }}
        run: |
          send() { curl -sS --form-string chat_id="$1" ${2:+--form-string message_thread_id="$2"} --form-string caption="LinkBox v1.${{ github.run_number }}" -F document=@"$APK" "https://api.telegram.org/bot$TG_TOKEN/sendDocument"; echo; }
          if [ -z "$TG_TOKEN" ]; then echo "Telegram не налаштовано, пропуск"; exit 0; fi
          if [ -n "$TG_CHAT" ]; then send "$TG_CHAT"; fi
          if [ -n "$TG_CHANNEL" ]; then send "$TG_CHANNEL" "$TG_THREAD"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: LinkBox-v1.${{ github.run_number }}
          path: ${{ env.APK }}
      - name: Telegram error
        if: failure()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            curl -sS -d chat_id="$TG_CHAT" --data-urlencode text="LinkBox: збірка #${{ github.run_number }} впала. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "https://api.telegram.org/bot$TG_TOKEN/sendMessage"
          fi
