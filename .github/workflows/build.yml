name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Signing key
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "build"
            git config user.email "build@example.com"
            git add debug.keystore
            git commit -m "Add signing key"
            git push
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Prepare
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init LinkBox com.shans.linkbox --web-dir=www
          npx cap add android
          mkdir -p assets
          cp icon.jpg assets/icon-only.jpg
          cp icon.jpg assets/icon-foreground.jpg
          cp icon.jpg assets/icon-background.jpg
          npm i -D @capacitor/assets
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk LinkBox.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LinkBox
          path: LinkBox.apk
