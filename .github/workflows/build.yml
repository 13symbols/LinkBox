name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init LinkBox com.shans.linkbox --web-dir=www
          npx cap add android
          pip install --break-system-packages pillow
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          python3 - <<'PY'
          from PIL import Image
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for n, s in sizes.items():
              im = Image.open('icon.png').convert('RGBA').resize((s, s), Image.LANCZOS)
              for f in ('ic_launcher.png', 'ic_launcher_round.png'):
                  im.save('android/app/src/main/res/mipmap-' + n + '/' + f)
          PY
          npx cap sync android
      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk LinkBox.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LinkBox
          path: LinkBox.apk
