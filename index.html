
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ECEAE4" id="meta-theme-color">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="application-name" content="LinkBox">
    <title>LinkBox // Smart Link Organizer</title>
    <link rel="manifest" id="pwa-manifest">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* 1. СВЕТЛАЯ ТЕМА ПО УМОЛЧАНИЮ */
        :root {
            --bg-body: #ECEAE4;
            --text-main: #141413;
            --text-muted: #6E6B64;
            --bg-surface: #F6F4EE;
            --bg-header: rgba(236, 234, 228, 0.94);
            --border-main: #D6D3C9;
            --bg-input: #E2E0D8;
            --bg-card: #FAF9F5;
            --icon-stroke: #141413;
        }

        /* 2. ТЁМНАЯ ТЕМА: Мягкий сланец («золотая середина») */
        body[data-theme="dim"] {
            --bg-body: #2C2C28;
            --text-main: #F5F2EB;
            --text-muted: #B0ACA2;
            --bg-surface: #363631;
            --bg-header: rgba(44, 44, 40, 0.94);
            --border-main: #484842;
            --bg-input: #242420;
            --bg-card: #383833;
            --icon-stroke: #F5F2EB;
        }

        /* 3. ЧЁРНАЯ ТЕМА (AMOLED) */
        body[data-theme="oled"] {
            --bg-body: #0A0A09;
            --text-main: #F2EFE9;
            --text-muted: #827F78;
            --bg-surface: #141412;
            --bg-header: rgba(10, 10, 9, 0.95);
            --border-main: #242420;
            --bg-input: #1C1C19;
            --bg-card: #141412;
            --icon-stroke: #F2EFE9;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
            user-select: none;
            transition: background-color 0.2s ease, color 0.2s ease;
            padding-bottom: calc(4.5rem + env(safe-area-inset-bottom, 0px));
            overscroll-behavior-y: none;
        }
        /* Блокировка скролла фона БЕЗ touch-action: none, чтобы скролл внутри шторок работал по всей ширине экрана */
        body.sheet-locked {
            overflow: hidden !important;
        }

        /* Безопасный отступ шапки под статус-бар смартфона (HyperOS / Android / iOS) */
        .safe-top-header {
            padding-top: calc(max(env(safe-area-inset-top, 0px), 28px) + 0.55rem);
            padding-bottom: 0.7rem;
        }

        .font-mono-code { font-family: 'JetBrains Mono', monospace; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .theme-surface { background-color: var(--bg-surface); border-color: var(--border-main); }
        .theme-header { background-color: var(--bg-header); border-color: var(--border-main); }
        .theme-input { background-color: var(--bg-input); color: var(--text-main); }
        .theme-card { background-color: var(--bg-card); border-color: var(--border-main); }
        .theme-muted { color: var(--text-muted); }

        /* Строгие минималистичные иконки одной линией */
        .mono-icon {
            stroke: var(--icon-stroke);
            fill: none;
            stroke-width: 1.75;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .key-press { transition: transform 0.12s ease, opacity 0.12s ease; }
        .key-press:active { transform: scale(0.97); }

        /* Плавные шторки снизу со свободным вертикальным скроллом по всему центру экрана */
        .sheet-backdrop {
            transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
            overscroll-behavior: contain;
        }
        .sheet-panel {
            transform: translateY(100%);
            transition: transform 0.34s cubic-bezier(0.16, 1, 0.3, 1);
            overscroll-behavior: contain;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
        }
        .sheet-backdrop.open { opacity: 1; }
        .sheet-backdrop.open .sheet-panel { transform: translateY(0); }
    </style>
</head>
<body class="min-h-screen">

    <!-- ШАПКА: Защищена от перекрытия статус-баром смартфона. Клик по логотипу сбрасывает фильтры -->
    <header class="sticky top-0 z-40 theme-header backdrop-blur-md border-b px-4 safe-top-header">
        <div class="max-w-4xl mx-auto flex items-center justify-between gap-2.5">
            
            <!-- Левый блок: Кнопка Домой (Логотип + Название + Количество ссылок) -->
            <div onclick="resetToAllLinks()" title="Показати всі посилання" class="key-press flex items-center gap-2.5 min-w-0 cursor-pointer">
                <div class="w-10 h-10 rounded-lg bg-[#141413] flex items-center justify-center shrink-0 p-1.5 shadow-2xs">
                    <svg viewBox="0 0 100 100" class="w-full h-full">
                        <circle cx="50" cy="50" r="37" fill="none" stroke="#D96B27" stroke-width="11"/>
                        <path d="M 16 64 Q 24 77 38 82" fill="none" stroke="#F6F4EE" stroke-width="11"/>
                        <path d="M 84 36 Q 76 23 62 18" fill="none" stroke="#F6F4EE" stroke-width="11"/>
                        <circle cx="50" cy="50" r="30.5" fill="none" stroke="#141413" stroke-width="3.5"/>
                        <circle cx="50" cy="50" r="23" fill="none" stroke="#F6F4EE" stroke-width="11"/>
                        <path d="M 29 40 A 23 23 0 0 0 45 72" fill="none" stroke="#D96B27" stroke-width="11" stroke-linecap="round"/>
                        <path d="M 71 60 A 23 23 0 0 0 55 28" fill="none" stroke="#D96B27" stroke-width="11" stroke-linecap="round"/>
                        <circle cx="50" cy="50" r="16.5" fill="#141413"/>
                    </svg>
                </div>
                <div class="flex items-center gap-2 min-w-0">
                    <h1 class="text-lg sm:text-xl font-black tracking-tight uppercase truncate">LinkBox</h1>
                    <span id="total-count-pill" class="text-xs font-mono-code font-bold px-2 py-0.5 rounded-md bg-[#D96B27] text-white shrink-0">
                        6
                    </span>
                    <button id="offline-queue-pill" onclick="processOfflineQueue(true)" title="Черга офлайн-посилань (натисніть для перевірки мережі)" class="hidden text-[11px] font-mono-code font-bold px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-600 border border-amber-500/40 shrink-0 items-center gap-1">
                        <span>⏳</span><span id="offline-queue-count">0</span>
                    </button>
                    <span id="active-filter-pill" class="hidden text-[11px] font-mono-code font-bold px-2 py-0.5 rounded-md theme-input truncate max-w-[120px] sm:max-w-[190px]"></span>
                </div>
            </div>

            <!-- Правый блок: Кнопка массового выбора + Кнопка Меню -->
            <div class="flex items-center gap-2 shrink-0">
                <button onclick="toggleSelectMode()" id="select-mode-btn" title="Масовий вибір та видалення" class="key-press w-10 h-10 rounded-lg theme-input flex items-center justify-center transition">
                    <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24">
                        <polyline points="9 11 12 14 22 4"/>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                    </svg>
                </button>
                <button onclick="openMenuSheet()" class="key-press h-10 px-3.5 sm:px-4 rounded-lg theme-input flex items-center gap-2 font-bold text-sm hover:opacity-90 transition">
                    <svg class="w-5 h-5 mono-icon" viewBox="0 0 24 24">
                        <line x1="3" y1="7" x2="21" y2="7"/>
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="17" x2="15" y2="17"/>
                    </svg>
                    <span id="btn-menu-label">Меню</span>
                </button>
            </div>

        </div>
    </header>

    <!-- ГЛАВНЫЙ КОНТЕЙНЕР -->
    <main class="max-w-4xl mx-auto px-4 py-3.5 space-y-3.5">

        <!-- Строка ввода ссылок -->
        <div class="flex items-stretch gap-2">
            <input id="url-input" type="text" onkeydown="if(event.key==='Enter') addLinkByAI()" placeholder="Вставте посилання або список посилань..." class="flex-1 theme-card border rounded-lg px-3.5 py-3 text-base outline-none font-medium focus:border-[#D96B27] transition min-w-0">
            <button onclick="addLinkByAI()" title="Розумне додавання посилання" class="key-press bg-[#D96B27] hover:bg-[#c55d1d] text-white font-black text-sm px-4 sm:px-5 rounded-lg flex items-center justify-center gap-2 shrink-0 shadow-xs">
                <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none">
                    <path d="M11 5v14M4 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M19 2.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2z" fill="currentColor"/>
                </svg>
                <span id="btn-add-label">Додати</span>
            </button>
        </div>

        <!-- КОМПАКТНАЯ КАРУСЕЛЬ ЗАКРЕПЛЁННЫХ ССЫЛОК С РЕАЛЬНЫМИ ФАВИКОНАМИ САЙТОВ -->
        <div id="pinned-bar-wrapper" class="hidden items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
            <!-- Заполняется через JS компактными кнопками с фавиконами сайтов -->
        </div>

        <!-- Панель массового выбора и удаления (появляется только в режиме выбора) -->
        <div id="bulk-action-bar" class="hidden theme-card border border-[#D96B27] rounded-xl p-3 items-center justify-between gap-2">
            <div class="flex items-center gap-2">
                <button onclick="selectAllVisible()" class="key-press px-3 py-1.5 rounded-lg theme-input text-xs font-bold" id="btn-select-all">
                    Вибрати всі
                </button>
                <span id="selected-count-label" class="text-xs font-mono-code font-bold theme-muted">0 вибрано</span>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="deleteSelectedItems()" class="key-press px-3.5 py-1.5 rounded-lg bg-rose-500 text-white text-xs font-extrabold" id="btn-delete-selected">
                    Видалити вибрані
                </button>
                <button onclick="toggleSelectMode()" class="key-press px-3 py-1.5 rounded-lg theme-input text-xs font-bold" id="btn-cancel-select">
                    Скасувати
                </button>
            </div>
        </div>

        <!-- Карточки -->
        <div id="cards-container">
            <!-- Заполняется через JS -->
        </div>

    </main>

    <!-- ШТОРКА «МЕНЮ» -->
    <div id="menu-sheet-modal" onclick="if(event.target===this) closeMenuSheet()" class="sheet-backdrop fixed inset-0 bg-black/60 z-50 hidden items-end justify-center p-0 sm:p-4">
        <div id="menu-sheet-panel" class="sheet-panel theme-surface w-full max-w-md rounded-t-2xl sm:rounded-xl p-5 border-t sm:border space-y-4 max-h-[88vh] overflow-y-auto">
            
            <!-- Полосочка для стягивания вниз -->
            <div id="menu-drag-handle" class="w-12 h-2 bg-stone-400/50 rounded-full mx-auto -mt-1 cursor-grab active:cursor-grabbing touch-none"></div>
            
            <!-- Шапка Меню -->
            <div class="flex items-center justify-between">
                <span class="font-black text-base uppercase tracking-tight" id="menu-title-label">Меню</span>
                <button onclick="closeMenuSheet()" class="key-press w-9 h-9 rounded-lg theme-input flex items-center justify-center">
                    <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- СТРОКА 1: Поиск (с крестиком очистки) + Кнопка Рандомайзера -->
            <div class="flex items-stretch gap-2">
                <div class="flex-1 flex items-center theme-input rounded-lg px-3 py-2.5">
                    <svg class="w-4 h-4 mono-icon mr-2 shrink-0 opacity-70" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/>
                    </svg>
                    <input id="search-input" oninput="onSearchInput()" type="text" placeholder="Пошук..." class="w-full bg-transparent text-sm sm:text-base outline-none font-medium min-w-0">
                    <button id="clear-search-btn" onclick="clearSearchInput()" class="hidden w-6 h-6 rounded-md items-center justify-center theme-muted hover:text-[#D96B27] shrink-0 ml-1" title="Очистити пошук">
                        ✕
                    </button>
                </div>
                <button onclick="openRandomLink()" title="Випадкове посилання" class="key-press px-3.5 rounded-lg theme-input flex items-center justify-center gap-2 font-bold text-xs hover:opacity-80 shrink-0">
                    <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24">
                        <polyline points="16 3 21 3 21 8"/>
                        <line x1="4" y1="20" x2="21" y2="3"/>
                        <polyline points="21 16 21 21 16 21"/>
                        <line x1="15" y1="15" x2="21" y2="21"/>
                        <line x1="4" y1="4" x2="9" y2="9"/>
                    </svg>
                    <span id="btn-random-label">Рандом</span>
                </button>
            </div>

            <!-- СТРОКА 2: Раскладка, Тема и Сортировка -->
            <div class="space-y-2">
                <div class="grid grid-cols-12 gap-2">
                    <!-- Переключатель вида (7 колонок) -->
                    <div class="col-span-7 grid grid-cols-3 gap-1 p-1 rounded-lg theme-input">
                        <button onclick="setLayoutMode('small')" id="layout-small-btn" title="Малі картки" class="key-press py-2 rounded-md flex items-center justify-center gap-1.5 text-xs font-bold transition">
                            <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                        </button>
                        <button onclick="setLayoutMode('large')" id="layout-large-btn" title="Великі картки" class="key-press py-2 rounded-md flex items-center justify-center gap-1.5 text-xs font-bold transition">
                            <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6"/><rect x="3" y="14" width="18" height="6"/></svg>
                        </button>
                        <button onclick="setLayoutMode('list')" id="layout-list-btn" title="Список" class="key-press py-2 rounded-md flex items-center justify-center gap-1.5 text-xs font-bold transition">
                            <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                        </button>
                    </div>

                    <!-- Переключатель тем (5 колонок) -->
                    <div class="col-span-5 grid grid-cols-3 gap-1 p-1 rounded-lg theme-input">
                        <button onclick="setThemeMode('light')" id="theme-light-btn" title="Світла тема" class="key-press py-2 rounded-md flex items-center justify-center transition">
                            <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="4"/>
                                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                            </svg>
                        </button>
                        <button onclick="setThemeMode('dim')" id="theme-dim-btn" title="Темна тема" class="key-press py-2 rounded-md flex items-center justify-center transition">
                            <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24">
                                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                            </svg>
                        </button>
                        <button onclick="setThemeMode('device')" id="theme-device-btn" title="AMOLED" class="key-press py-2 rounded-md flex items-center justify-center transition">
                            <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="8"/>
                                <path d="M12 4a8 8 0 0 0 0 16Z" fill="currentColor" stroke="none"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Переключатель сортировки (Нові / Старі / А–Я) -->
                <div class="grid grid-cols-3 gap-1 p-1 rounded-lg theme-input">
                    <button onclick="setSortMode('newest')" id="sort-newest-btn" class="key-press py-1.5 rounded-md text-xs font-bold transition">
                        ↓ Нові
                    </button>
                    <button onclick="setSortMode('oldest')" id="sort-oldest-btn" class="key-press py-1.5 rounded-md text-xs font-bold transition">
                        ↑ Старі
                    </button>
                    <button onclick="setSortMode('az')" id="sort-az-btn" class="key-press py-1.5 rounded-md text-xs font-bold transition">
                        А–Я
                    </button>
                </div>
            </div>

            <!-- СТРОКА 3: ПАПКИ / КАТЕГОРИИ -->
            <div class="space-y-2">
                <div class="flex items-center justify-between">
                    <span class="text-[11px] font-mono-code font-bold uppercase theme-muted" id="lbl-folders-section">Категорії</span>
                </div>
                <div id="folders-grid" class="grid grid-cols-2 gap-1.5 max-h-52 overflow-y-auto overscroll-contain pr-0.5">
                    <!-- Заполняется через JS -->
                </div>
            </div>

            <!-- СТРОКА 4: Импорт, Экспорт (с выбором HTML/JSON), #, UA и кнопка Инфо -->
            <div class="space-y-2 pt-3 border-t" style="border-color: var(--border-main)">
                <!-- Выпадающая мини-плашка выбора формата экспорта (HTML для браузеров или полный JSON-бэкап) -->
                <div id="export-choice-bar" class="hidden grid-cols-2 gap-1.5 p-1.5 rounded-xl theme-input">
                    <button onclick="exportBrowserBookmarks()" class="key-press py-2 px-2.5 rounded-lg theme-card border text-xs font-bold flex items-center justify-center gap-1.5">
                        <span class="font-mono-code text-[#D96B27]">.HTML</span>
                        <span id="lbl-exp-html">Для браузера</span>
                    </button>
                    <button onclick="exportFullJsonBackup()" class="key-press py-2 px-2.5 rounded-lg theme-card border text-xs font-bold flex items-center justify-center gap-1.5">
                        <span class="font-mono-code text-[#D96B27]">.JSON</span>
                        <span id="lbl-exp-json">Повний бекап</span>
                    </button>
                </div>

                <div class="flex items-center gap-1.5">
                    <input id="ai-import-file" type="file" accept=".html,.htm,.txt,.json,.csv" class="hidden" onchange="handleAIFileImport(event)">
                    
                    <!-- Кнопка Импорт: иконка папки с входящей стрелкой вниз и чистая надпись -->
                    <button onclick="triggerAIFileImport()" class="key-press flex-1 h-10 px-2.5 rounded-lg bg-[#D96B27] text-white text-xs font-black flex items-center justify-center gap-1.5 min-w-0">
                        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                            <line x1="12" y1="10" x2="12" y2="16"/>
                            <polyline points="9 13 12 16 15 13"/>
                        </svg>
                        <span id="btn-import-ai" class="truncate">Імпорт</span>
                    </button>

                    <!-- Кнопка Экспорт: иконка папки с исходящей стрелкой наружу -->
                    <button onclick="toggleExportChoiceBar()" class="key-press flex-1 h-10 px-2.5 rounded-lg theme-input text-xs font-bold flex items-center justify-center gap-1.5 min-w-0">
                        <svg class="w-4 h-4 mono-icon shrink-0" viewBox="0 0 24 24">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                            <line x1="12" y1="16" x2="12" y2="10"/>
                            <polyline points="9 13 12 10 15 13"/>
                        </svg>
                        <span id="btn-export-html" class="truncate">Експорт</span>
                    </button>

                    <!-- Кнопка # между Експорт и UA -->
                    <button onclick="openTagsSheetFromMenu()" title="Усі хештеги #" class="key-press w-10 h-10 rounded-lg theme-input text-xs font-mono-code font-black flex items-center justify-center hover:text-[#D96B27] transition shrink-0">
                        #
                    </button>

                    <!-- Кнопка языка UA / EN -->
                    <button onclick="toggleLang()" id="lang-btn" class="key-press h-10 px-2.5 rounded-lg theme-input text-xs font-mono-code font-bold flex items-center justify-center shrink-0">
                        UA
                    </button>

                    <!-- Векторная иконка «О приложении» -->
                    <button onclick="openAboutSheetFromMenu()" title="Про додаток та авторські права" class="key-press w-10 h-10 rounded-lg theme-input flex items-center justify-center hover:text-[#D96B27] transition shrink-0">
                        <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="9"/>
                            <line x1="12" y1="16" x2="12" y2="11.5"/>
                            <circle cx="12" cy="8" r="0.6" fill="currentColor"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ШТОРКА «#ХЕШТЕГИ» -->
    <div id="tags-sheet-modal" onclick="if(event.target===this) closeTagsSheet()" class="sheet-backdrop fixed inset-0 bg-black/60 z-50 hidden items-end justify-center p-0 sm:p-4">

        // Вспомогательная функция: возвращает массив всех категорий конкретной ссылки
        function getItemCats(item) {
            if (Array.isArray(item.cats) && item.cats.length > 0) {
                return item.cats.map(c => String(c).trim()).filter(Boolean);
            }
            if (typeof item.cat === 'string' && item.cat.trim()) {
                return item.cat.split(',').map(c => c.trim()).filter(Boolean);
            }
            return [currentLang === 'uk' ? 'Веб-ресурси' : 'Web Resources'];
        }

        function cleanRawUrl(raw) {
            let u = (raw || '').trim();
            u = u.replace(/^[,\s"'<>()[\]{};:]+|[,\s"'<>()[\]{}.;:]+$/g, '');
            if (!u) return '';
            if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
            return u;
        }

        // Формирование HTML реального фавикона сайта с аккуратным фоллбэком на первую букву домена
        function getSiteFaviconHtml(item, sizeClass = 'w-5 h-5') {
            const cleanDom = (item.domain || 'example.com').replace(/^www\./i, '');
            const favUrl = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(cleanDom)}&sz=64`;
            const letter = (item.name || cleanDom || 'W').charAt(0).toUpperCase();
            return `
                <span class="${sizeClass} rounded-md flex items-center justify-center overflow-hidden shrink-0 bg-white/95 border border-black/10 shadow-2xs relative">
                    <img src="${favUrl}" alt="${item.name}" class="w-4 h-4 object-contain" loading="lazy"
                        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <span style="display:none; background:${item.color}" class="w-full h-full items-center justify-center text-[10px] font-black text-white">${letter}</span>
                </span>
            `;
        }

        function saveStateToStorage() {
            try {
                const payload = {
                    items: ITEMS,
                    lockedFolders: Array.from(LOCKED_FOLDERS),
                    themeMode,
                    viewMode,
                    sortMode,
                    currentLang
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
            } catch (e) {}
        }

        function loadStateFromStorage() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('linkbox_hyperos_v1');
                if (!raw) return false;
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed.items)) {
                    ITEMS = parsed.items.map(it => {
                        const cleanedUrl = cleanRawUrl(it.url);
                        const isGenericClone = /Інформаційний портал .* актуальні новини|Проаналізовано ІІ/i.test(it.note || '');
                        if (isGenericClone) {
                            const customT = (!it.title || /Новини та аналітика|Корисний ресурс/i.test(it.title)) ? '' : it.title;
                            const rebuilt = buildSmartAIItem(cleanedUrl, customT);
                            return {
                                ...rebuilt,
                                id: it.id,
                                date: it.date || rebuilt.date,
                                lockedOverride: it.lockedOverride ?? null,
                                pinned: Boolean(it.pinned),
                                folderPriority: Boolean(it.folderPriority),
                                pendingOffline: Boolean(it.pendingOffline)
                            };
                        }
                        const normCats = getItemCats(it);
                        return {
                            ...it,
                            url: cleanedUrl,
                            cat: normCats[0],
                            cats: normCats,
                            pinned: Boolean(it.pinned),
                            folderPriority: Boolean(it.folderPriority),
                            pendingOffline: Boolean(it.pendingOffline)
                        };
                    });
                }
                if (Array.isArray(parsed.lockedFolders)) LOCKED_FOLDERS = new Set(parsed.lockedFolders);
                if (parsed.themeMode) themeMode = parsed.themeMode;
                if (parsed.viewMode) viewMode = parsed.viewMode;
                if (parsed.sortMode) sortMode = parsed.sortMode;
                if (parsed.currentLang) currentLang = parsed.currentLang;
                return true;
            } catch (e) {
                return false;
            }
        }

            a.rel = 'noopener noreferrer external';
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {

            }, 150);
        }

        function getFilteredItems() {
            const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
            let filtered = [];
            if (selectedFolder === 'ALL') {
                filtered = [...ITEMS];
            } else if (selectedFolder === OFFLINE_FOLDER_KEY) {
                filtered = ITEMS.filter(i => i.pendingOffline);
            } else {
                filtered = ITEMS.filter(i => getItemCats(i).includes(selectedFolder));
            }

            if (selectedTag) {
                filtered = filtered.filter(i => Array.isArray(i.tags) && i.tags.some(tg => tg.toLowerCase() === selectedTag.toLowerCase()));
            }
            if (q) {
                filtered = filtered.filter(i =>
                    [i.name, i.domain, i.title, ...getItemCats(i), i.note, ...(i.tags || [])].join(' ').toLowerCase().includes(q)
                );
            }

            if (sortMode === 'oldest') {
                filtered.reverse();
            } else if (sortMode === 'az') {
                filtered.sort((a, b) => (a.title || a.name).localeCompare(b.title || b.name, currentLang === 'uk' ? 'uk' : 'en'));
            }

            // Элементы с «Пріоритетом у папці» всегда поднимаются наверх списка внутри выбранной папки или общего списка
            filtered.sort((a, b) => (b.folderPriority ? 1 : 0) - (a.folderPriority ? 1 : 0));
            return filtered;
        }

        function renderTagsCloud() {
            const tagCounts = new Map();
            ITEMS.forEach(item => {
                (item.tags || []).forEach(rawTag => {
                    const clean = rawTag.trim();
                    if (!clean) return;
                    const key = clean.toLowerCase();
                    const prev = tagCounts.get(key) || { label: clean, count: 0 };
                    prev.count += 1;
                    tagCounts.set(key, prev);
                });
            });

            const container = document.getElementById('tags-cloud-container');
            const sorted = Array.from(tagCounts.values()).sort((a, b) => b.count - a.count);

            let html = `
                <button onclick="selectTagAndClose(null)" class="key-press px-3.5 py-2 rounded-lg text-xs font-mono-code font-bold flex items-center gap-2 transition ${
                    selectedTag === null ? 'bg-[#D96B27] text-white' : 'theme-input'
                }">
                    <span>${t('allFolders')}</span>
                    <span class="opacity-75">${ITEMS.length}</span>
                </button>
            `;

            html += sorted.map(tObj => {
                const isAct = selectedTag && selectedTag.toLowerCase() === tObj.label.toLowerCase();
                return `
                    <button onclick="selectTagAndClose('${tObj.label.replace(/'/g, "\\'")}')" class="key-press px-3.5 py-2 rounded-lg text-xs font-mono-code font-bold flex items-center gap-1.5 transition ${
                        isAct ? 'bg-[#D96B27] text-white' : 'theme-input'
                    }">
                        <span>${tObj.label}</span>
                        <span class="text-[10px] opacity-70 px-1.5 py-0.2 rounded bg-black/10">${tObj.count}</span>
                    </button>
                `;
            }).join('');

            container.innerHTML = html;
        }

        function copyItemUrl(url, e) {
            if (e) e.stopPropagation();
            const clean = cleanRawUrl(url);
            const temp = document.createElement('textarea');
            temp.value = clean;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            showToast(t('copied') + clean);
        }

        function openItemById(id, e) {
            if (e) e.stopPropagation();
            const item = ITEMS.find(x => x.id === id);
            if (!item) return;
            if (isItemLocked(item)) {
                showToast(t('lockedToast'));
                return;
            }
            openExternalUrlInNewTab(item.url);
        }

        function toggleExportChoiceBar() {

            if (!bar) return;
            if (bar.classList.contains('hidden')) {
                bar.classList.remove('hidden');
                bar.classList.add('grid');
            } else {
                bar.classList.add('hidden');
                bar.classList.remove('grid');

        function exportBrowserBookmarks() {
            const foldersMap = {};
            ITEMS.forEach(item => {
                getItemCats(item).forEach(catName => {
                    if (!foldersMap[catName]) foldersMap[catName] = [];
                    foldersMap[catName].push(item);
                });
            });
            const nowUnix = Math.floor(Date.now() / 1000);
            let html = `<!DOCTYPE NETSCAPE-Bookmark-file-1><META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8"><TITLE>LinkBox Bookmarks</TITLE><H1>LinkBox</H1><DL><p>\n`;
            Object.keys(foldersMap).forEach(cat => {
                html += `    <DT><H3 ADD_DATE="${nowUnix}">${cat}</H3>\n    <DL><p>\n`;
                foldersMap[cat].forEach(item => {
                    html += `        <DT><A HREF="${cleanRawUrl(item.url)}" ADD_DATE="${nowUnix}">${item.name} — ${item.title}</A>\n<DD>${item.note}\n`;
                });
                html += `    </DL><p>\n`;
            });
            html += `</DL><p>\n`;

            const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `linkbox_bookmarks.html`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast(t('exported'));
            closeMenuSheet();
        }

        function exportFullJsonBackup() {

                items: ITEMS,
                lockedFolders: Array.from(LOCKED_FOLDERS),
                themeMode,
                viewMode,

            const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json;charset=utf-8' });

            link.href = URL.createObjectURL(blob);
            link.download = `linkbox_backup_${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast(t('exportedJson'));
            closeMenuSheet();
        }

        function normalizeUrlForCompare(raw) {
            return cleanRawUrl(raw).replace(/^https?:\/\//i, '').replace(/^www\./i, '').replace(/\/+$/, '').toLowerCase();
        }

        function findDuplicateItem(rawUrl) {
            const target = normalizeUrlForCompare(rawUrl);
            if (!target) return null;
            return ITEMS.find(item => normalizeUrlForCompare(item.url) === target) || null;
        }

        function extractCleanBrandName(domain) {
            const parts = domain.split('.').filter(p => !['www', 'm', 'mobile', 'ua', 'com', 'net', 'org', 'gov', 'edu', 'info', 'io', 'co', 'uk', 'ru', 'it', 'de', 'fr', 'es', 'pl', 'biz'].includes(p));
            const root = parts.length > 0 ? parts[parts.length - 1] : domain.split('.')[0];
            if (!root) return 'Site';
            const mainBrand = root.charAt(0).toUpperCase() + root.slice(1);
            if (parts.length > 1) {
                const sub = parts[0].toLowerCase();
                const subMap = {
                    techno: 'Techno',
                    life: 'Life',
                    sport: 'Sport',
                    auto: 'Auto',
                    health: 'Health',
                    style: 'Style',
                    travel: 'Travel',
                    music: 'Music',
                    books: 'Books'
                };
                if (subMap[sub]) return `${mainBrand} ${subMap[sub]}`;
            }
            return mainBrand;
        }

        // ДЕТЕКТОР ЯЗЫКА САЙТА (UK / EN / IT / RU / DE / FR / ES / PL)
        function detectSiteLanguage(finalUrl, domain, humanTitle, slugTopic) {
            const lowerUrl = finalUrl.toLowerCase();
            const combinedText = `${humanTitle} ${slugTopic}`.trim();

            // 1. Явный языковой сегмент в URL (/it/, /en/, /ru/, /uk/, /de/, /fr/, /es/, /pl/)
            if (/\/(it|it-it|italiano)(\/|$)/i.test(lowerUrl)) return 'it';
            if (/\/(uk|ua|uk-ua)(\/|$)/i.test(lowerUrl)) return 'uk';
            if (/\/(ru|ru-ru)(\/|$)/i.test(lowerUrl)) return 'ru';
            if (/\/(de|de-de)(\/|$)/i.test(lowerUrl)) return 'de';
            if (/\/(fr|fr-fr)(\/|$)/i.test(lowerUrl)) return 'fr';
            if (/\/(es|es-es)(\/|$)/i.test(lowerUrl)) return 'es';
            if (/\/(pl|pl-pl)(\/|$)/i.test(lowerUrl)) return 'pl';
            if (/\/(en|en-us|en-gb)(\/|$)/i.test(lowerUrl)) return 'en';

            // 2. Проверка символов кириллицы и характерных слов в заголовке или декодированном слаге
            if (/[іїєґ]/i.test(combinedText)) return 'uk';
            if (/[ыъэё]/i.test(combinedText)) return 'ru';
            if (/[а-я]/i.test(combinedText)) {
                // Если есть кириллица без специфичных букв — смотрим на типичные русские/украинские слова и домен
                if (/\b(лучших|лучшие|самые|самых|века|романов|чтение|воскресное|смешные|заголовки|каналы|выбор|редакции|недорогой|купить|обзор|новости|технологии)\b/i.test(combinedText)) {
                    return 'ru';
                }
                if (/\b(найкращі| століття|недільне|читання|смішні|канали|вибір|редакції|недорогий|купити|огляд|новини|технології|посилання)\b/i.test(combinedText)) {
                    return 'uk';
                }
                if (/\.(ru|su|by|рф)$/i.test(domain)) return 'ru';
                return 'uk';
            }

            // 3. Национальные доменные зоны (TLD) и известные национальные медиа
            if (/\.(it|sm|va)$/i.test(domain) || /(repubblica|corriere|gazzetta|ansa|subito|raiplay|ilpost|fanpage|giallozafferano|trovaprezzi|aranzulla)\./i.test(domain)) {
                return 'it';
            }
            if (/\.(ru|su|рф)$/i.test(domain) || /(habr|kinopoisk|yandex|dzen|vc\.ru|rbc\.ru|lenta\.ru|ozon|wildberries|avito|4pda)\./i.test(domain)) {
                return 'ru';
            }
            if (/\.(ua|укр)$/i.test(domain) || /(rozetka|pravda\.com\.ua|nv\.ua|unian|tsn\.ua|dou\.ua|itc\.ua|ain\.ua|prom\.ua|monobank|privatbank|sinoptik|liga\.net|censor\.net|babel\.ua|hromadske)\b/i.test(domain)) {
                return 'uk';
            }
            if (/\.(de|at|ch)$/i.test(domain)) return 'de';
            if (/\.(fr)$/i.test(domain)) return 'fr';
            if (/\.(es)$/i.test(domain)) return 'es';
            if (/\.(pl)$/i.test(domain)) return 'pl';

            // 4. По характерным итальянским словам в латинском заголовке/слаге
            if (/\b(della|delle|degli|nella|nelle|sulla|sono|anche|questo|questa|migliori|notizie|ricette|comprare|prezzo|storia|italia|italiano|guida|come)\b/i.test(combinedText)) {
                return 'it';
            }

            // 5. Все международные домены (.com, .net, .org, .io, .dev, .ai, .co.uk, .us и др.) по умолчанию — английский (EN)
            return 'en';
        }

        function decodeUrlPathToHumanTopic(urlStr) {
            try {
                const u = new URL(cleanRawUrl(urlStr));
                const segments = u.pathname.split('/').filter(Boolean);
                if (segments.length === 0) return { topic: '', sectionHint: '', isRussianTranslit: false };

                let slug = decodeURIComponent(segments[segments.length - 1]);
                slug = slug.replace(/\.(html?|php|aspx?|jsp)$/i, '');
                slug = slug.replace(/(?:^|[-_])\d{4,}(?=$|[-_])/g, '');
                slug = slug.replace(/^\d+[-_]/, '');

                const sectionRaw = segments.length > 1 ? segments.slice(0, -1).join(' ').toLowerCase() : '';

                const words = slug.split(/[-_]+/).filter(w => w.length > 0 && !/^\d+$/.test(w));
                if (words.length < 2) return { topic: '', sectionHint: sectionRaw, isRussianTranslit: false };

                if (/[а-яіїєґ]/i.test(slug)) {
                    const cleanCyr = words.join(' ');
                    return {
                        topic: cleanCyr.charAt(0).toUpperCase() + cleanCyr.slice(1),
                        sectionHint: sectionRaw,
                        isRussianTranslit: /[ыъэё]/i.test(cleanCyr)
                    };
                }

                const SLUG_DICT = {
                    'luchshih': 'лучших', 'luchshie': 'лучшие', 'samye': 'самые', 'samyh': 'самых',
                    'nauchno': 'научно', 'fantasticheskih': 'фантастических', 'romanov': 'романов',
                    'knig': 'книг', 'knigi': 'книги', 'xxi': 'XXI', 'veka': 'века', 'chtivo': 'чтиво',
                    'voskresnoje': 'воскресное', 'smeshnye': 'смешные', 'zagolovki': 'заголовки',
                    'ukrainskiy': 'украинский', 'ukrainskie': 'украинские', 'shou': 'шоу', 'biz': 'биз',
                    'memy': 'мемы', 'pro': 'про', 'literaturu': 'литературу', 'veselye': 'весёлые',
                    'kanaly': 'каналы', 'telegram': 'Telegram', 'vybor': 'выбор', 'redakcii': 'редакции',
                    'kakie': 'какие', 'sajty': 'сайты', 'rabotayut': 'работают', 'ukraine': 'Украине',
                    'ukraina': 'Украина', 'besplatno': 'бесплатно', 'onlajn': 'онлайн', 'smotret': 'смотреть',
                    'serialy': 'сериалы', 'filmy': 'фильмы', 'kino': 'кино', 'novosti': 'новости',
                    'tehnologii': 'технологии', 'gadzhety': 'гаджеты', 'smartfony': 'смартфоны',
                    'obzor': 'обзор', 'reyting': 'рейтинг', 'top': 'ТОП', 'kak': 'как', 'chto': 'что',
                    'gde': 'где', 'kogda': 'когда', 'pochemu': 'почему', 'sovety': 'советы',
                    'instrukciya': 'инструкция', 'recepty': 'рецепты', 'igry': 'игры', 'muzyka': 'музыка',
                    'nauka': 'наука', 'kosmos': 'космос', 'istoriya': 'история', 'ekonomika': 'экономика',
                    'biznes': 'бизнес', 'kriptovalyuta': 'криптовалюта', 'kurs': 'курс', 'valyut': 'валют',
                    'nedorogoy': 'недорогой', 'kupit': 'купить', 'cena': 'цена'
                };

                const hasRuDictMatch = words.some(w => Boolean(SLUG_DICT[w.toLowerCase()]));
                const isTranslitLike = hasRuDictMatch || words.filter(w => /(shch|zh|kh|vo|oje|yye|ih|yh)$/i.test(w)).length >= 2;

                function translitWordToCyr(w) {
                    const low = w.toLowerCase();
                    if (SLUG_DICT[low]) return SLUG_DICT[low];
                    if (['ai', 'ui', 'ux', 'it', 'ios', 'android', 'apk', 'pc', 'tv', 'usb', 'wifi', 'vpn', 'gpt', 'telegram', 'youtube', 'netflix', 'spotify', 'starlink', 'ecoflow'].includes(low)) {
                        return w.toUpperCase() === w ? w : (w.charAt(0).toUpperCase() + w.slice(1));
                    }
                    let s = low
                        .replace(/shch/g, 'щ')
                        .replace(/yo/g, 'ё')
                        .replace(/zh/g, 'ж')
                        .replace(/kh/g, 'х')
                        .replace(/ts/g, 'ц')
                        .replace(/ch/g, 'ч')
                        .replace(/sh/g, 'ш')
                        .replace(/yu/g, 'ю')
                        .replace(/ya/g, 'я')
                        .replace(/je/g, 'е')
                        .replace(/iy/g, 'ий')
                        .replace(/yy/g, 'ый')
                        .replace(/aya/g, 'ая')
                        .replace(/oye/g, 'ое');
                    const map = {
                        a:'а', b:'б', v:'в', g:'г', d:'д', e:'е', z:'з', i:'и', j:'й', y:'й',
                        k:'к', l:'л', m:'м', n:'н', o:'о', p:'п', r:'р', s:'с', t:'т', u:'у',
                        f:'ф', h:'х', c:'ц', w:'в', x:'кс', q:'к'
                    };
                    let out = '';
                    for (const ch of s) out += map[ch] || ch;
                    return out;
                }

                const converted = words.slice(0, 11).map(w => isTranslitLike ? translitWordToCyr(w) : w);
                let phrase = converted.join(' ').trim();
                if (phrase) {
                    phrase = phrase.charAt(0).toUpperCase() + phrase.slice(1);
                }
                return { topic: phrase, sectionHint: sectionRaw, isRussianTranslit: isTranslitLike };
            } catch (e) {
                return { topic: '', sectionHint: '', isRussianTranslit: false };
            }
        }

        function sanitizeBookmarkTitle(rawTitle, cleanName) {
            if (!rawTitle) return '';
            let tStr = rawTitle.trim();
            if (/^https?:\/\//i.test(tStr)) return '';
            tStr = tStr.replace(/[,\s]+$/g, '');
            if (/—\s*[a-z0-9_-]+\s+\d{4,}/i.test(tStr)) return '';
            if (tStr.length < 2) return '';
            return tStr;
        }

        function buildSmartAIItem(rawUrl, customTitle = '') {
            const finalUrl = cleanRawUrl(rawUrl);
            const domain = finalUrl.replace(/^https?:\/\//i, '').replace(/^www\./i, '').split('/')[0].toLowerCase();
            const cleanName = extractCleanBrandName(domain);
            const { topic: slugTopic, sectionHint } = decodeUrlPathToHumanTopic(finalUrl);
            const humanTitle = sanitizeBookmarkTitle(customTitle, cleanName) || slugTopic;

            // Определяем язык сайта (UK, EN, IT, RU и др.)
            const siteLang = detectSiteLanguage(finalUrl, domain, humanTitle, slugTopic);

            const pageTopicSignal = `${humanTitle} ${sectionHint} ${finalUrl}`.toLowerCase();
            const domainOnlySignal = domain.toLowerCase();

            let catKey = 'web';
            let cat = currentLang === 'uk' ? 'Веб-ресурси' : 'Web Resources';
            let color = '#4F6352';
            let svg = LINE_ICONS.globe;

                catKey = 'book';

                color = '#6B5344';
                svg = LINE_ICONS.book;

            const localized = generateLocalizedMeta(siteLang, catKey, cleanName, domain, humanTitle, baseBrandTag);
            const finalTitle = humanTitle || localized.defaultTitle;
            const now = new Date();
            const dateStr = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getFullYear()).slice(-2)}`;

            const suggestedCats = [];
            if (/roman|книг|літератур|литератур|наук|science|book|wiki/i.test(pageTopicSignal)) suggestedCats.push(currentLang === 'uk' ? 'Книги та Освіта' : 'Books & Science');

            if (/news|новин|новости|notizie|pravda|nv\.ua|unian|bbc|reuters/i.test(pageTopicSignal)) suggestedCats.push(currentLang === 'uk' ? 'Новини та ЗМІ' : 'News & Media');
            if (/design|дизайн|ui|ux|figma|behance/i.test(pageTopicSignal)) suggestedCats.push(currentLang === 'uk' ? 'Дизайн' : 'Design');
            if (/shop|rozetka|amazon|купит|ціна|товар|покупки/i.test(pageTopicSignal)) suggestedCats.push(currentLang === 'uk' ? 'Покупки' : 'Shopping');
            if (/movie|кіно|кино|серіал|сериал|netflix|youtube/i.test(pageTopicSignal)) suggestedCats.push(currentLang === 'uk' ? 'Кіно та Серіали' : 'Movies & Video');
            if (/music|музик|музык|spotify|soundcloud/i.test(pageTopicSignal)) suggestedCats.push(currentLang === 'uk' ? 'Музика' : 'Music');
            if (/travel|airbnb|booking|карпат|подорож/i.test(pageTopicSignal)) suggestedCats.push(currentLang === 'uk' ? 'Поїздки' : 'Travel');

            return {
                id: Date.now() + Math.floor(Math.random() * 100000),
                name: cleanName,
                domain,
                url: finalUrl,
                title: finalTitle,
                cat,
                cats: [cat],
                aiSuggestedCats: Array.from(new Set([cat, ...suggestedCats])),
                date: dateStr,
                color,
                note: localized.note,
                tags: localized.tags,
                svg,
                siteLang: siteLang.toUpperCase(),
                lockedOverride: null,
                pinned: false,
                folderPriority: false,
                pendingOffline: false
            };
        }

        async function enrichItemWithLiveTitle(itemId, targetUrl) {
            if (!navigator.onLine) return false;
            try {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 3500);
                const resp = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(targetUrl)}`, { signal: controller.signal });
                clearTimeout(timer);
                if (resp.ok) {
                    const data = await resp.json();
                    const idx = ITEMS.findIndex(x => x.id === itemId);
                    if (idx !== -1) {
                        const updated = buildSmartAIItem(targetUrl, data && data.title ? data.title : '');
                        ITEMS[idx] = {
                            ...updated,
                            id: itemId,
                            date: ITEMS[idx].date,
                            lockedOverride: ITEMS[idx].lockedOverride,
                            pinned: ITEMS[idx].pinned,
                            folderPriority: ITEMS[idx].folderPriority,
                            pendingOffline: false
                        };
                        saveStateToStorage();
                        renderApp();
                        return true;
                    }
                }
            } catch (e) {}
            // Даже если у сайта нет oEmbed, при наличии сети снимаем флаг ожидания офлайна и распиливаем локальным ИИ
            const idx = ITEMS.findIndex(x => x.id === itemId);
            if (idx !== -1 && ITEMS[idx].pendingOffline) {
                const rebuilt = buildSmartAIItem(targetUrl, ITEMS[idx].title);
                ITEMS[idx] = {
                    ...rebuilt,
                    id: itemId,
                    date: ITEMS[idx].date,
                    lockedOverride: ITEMS[idx].lockedOverride,
                    pinned: ITEMS[idx].pinned,
                    folderPriority: ITEMS[idx].folderPriority,
                    pendingOffline: false
                };
                saveStateToStorage();
                renderApp();
                return true;
            }
            return false;
        }

        // Автоматическая обработка офлайн-очереди при появлении интернета
        async function processOfflineQueue(manualTap = false) {
            const pending = ITEMS.filter(i => i.pendingOffline);
            if (pending.length === 0) return;

            if (!navigator.onLine) {
                if (manualTap) {
                    selectedFolder = OFFLINE_FOLDER_KEY;
                    renderApp();
                    showToast(t('offlineStillNoNet'));
                }
                return;
            }

            let processedCount = 0;
            for (const item of pending) {
                const ok = await enrichItemWithLiveTitle(item.id, item.url);
                if (ok) processedCount++;
            }

            if (processedCount > 0) {
                if (selectedFolder === OFFLINE_FOLDER_KEY && ITEMS.filter(i => i.pendingOffline).length === 0) {
                    selectedFolder = 'ALL';
                }
                saveStateToStorage();
                renderApp();
                showToast(`${t('offlineSyncedToast')}${processedCount} ✓`);
            }
        }

        window.addEventListener('online', () => {
            processOfflineQueue(false);
        });

        function highlightExistingCard(item) {
            if (selectedFolder !== 'ALL' && !getItemCats(item).includes(selectedFolder)) {
                selectedFolder = 'ALL';
            }
            selectedTag = null;
            highlightedDuplicateId = item.id;
            renderApp();
            setTimeout(() => {
                const el = document.getElementById(`card-${item.id}`);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 60);
            setTimeout(() => {
                highlightedDuplicateId = null;
                renderApp();
            }, 2600);
        }

        function addLinkByAI() {
            const input = document.getElementById('url-input');
            const rawText = input.value.trim();
            if (!rawText) return;

            const isOfflineNow = !navigator.onLine;
            const urlMatches = rawText.match(/(?:https?:\/\/|www\.)[^\s"'<>]+/gi);
            const rawCandidates = urlMatches && urlMatches.length > 0 ? urlMatches : [rawText];
            const candidates = rawCandidates.map(u => cleanRawUrl(u)).filter(Boolean);

            if (candidates.length === 1) {
                const singleUrl = candidates[0];
                const existing = findDuplicateItem(singleUrl);
                if (existing) {
                    showToast(`${t('duplicateFound')}${existing.name} (${getItemCats(existing).join(', ')})`);
                    highlightExistingCard(existing);
                    return;
                }
                const newItem = buildSmartAIItem(singleUrl);
                if (isOfflineNow) {
                    newItem.pendingOffline = true;
                }
                ITEMS.unshift(newItem);
                input.value = '';
                saveStateToStorage();
                renderApp();
                if (isOfflineNow) {
                    showToast(t('aiAddedOffline'));
                } else {
                    showToast(t('aiAddedSingle').replace('{cat}', newItem.cat).replace('{lang}', newItem.siteLang || 'AUTO'));
                    enrichItemWithLiveTitle(newItem.id, singleUrl);
                }
            } else if (candidates.length > 1) {
                let added = 0;
                let dups = 0;
                candidates.forEach(u => {
                    if (findDuplicateItem(u)) {
                        dups++;
                    } else {
                        const created = buildSmartAIItem(u);
                        if (isOfflineNow) {
                            created.pendingOffline = true;
                        } else {
                            enrichItemWithLiveTitle(created.id, u);
                        }
                        ITEMS.unshift(created);
                        added++;
                    }
                });
                input.value = '';
                saveStateToStorage();
                renderApp();
                showToast(isOfflineNow ? t('aiAddedOffline') : t('aiImportReport').replace('{added}', added).replace('{dups}', dups));
            }
        }

        function triggerAIFileImport() {
            const fileInput = document.getElementById('ai-import-file');
            if (fileInput) {
                fileInput.value = '';
                fileInput.click();
            }
        }

        function handleAIFileImport(event) {
            const file = event.target.files?.[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const content = String(e.target?.result || '');

                // Проверяем, не является ли файл полным JSON-бэкапом LinkBox
                try {
                    const maybeJson = JSON.parse(content);
                    if (maybeJson && Array.isArray(maybeJson.items)) {
                        let added = 0;
                        let dups = 0;
                        maybeJson.items.forEach(it => {
                            if (findDuplicateItem(it.url)) {
                                dups++;
                            } else {
                                const normCats = getItemCats(it);
                                ITEMS.push({
                                    ...it,
                                    url: cleanRawUrl(it.url),
                                    cat: normCats[0],
                                    cats: normCats,
                                    pinned: Boolean(it.pinned),
                                    folderPriority: Boolean(it.folderPriority),
                                    pendingOffline: Boolean(it.pendingOffline)
                                });
                                added++;
                            }
                        });
                        if (Array.isArray(maybeJson.lockedFolders)) {
                            maybeJson.lockedFolders.forEach(f => LOCKED_FOLDERS.add(f));
                        }
                        saveStateToStorage();
                        renderFoldersInMenu();
                        renderApp();
                        closeMenuSheet();
                        showToast(t('restoredJson') + `+${added} (${dups} dups)`);
                        return;
                    }
                } catch (err) {}

                const parser = new DOMParser();
                const doc = parser.parseFromString(content, 'text/html');
                const anchors = Array.from(doc.querySelectorAll('a[href]'));

                let added = 0;
                let dups = 0;
                const isOfflineNow = !navigator.onLine;

                if (anchors.length > 0) {
                    anchors.forEach(a => {
                        const href = cleanRawUrl(a.getAttribute('href') || '');
                        if (!/^https?:\/\//i.test(href)) return;
                        if (findDuplicateItem(href)) {
                            dups++;
                        } else {
                            const textTitle = (a.textContent || '').trim();
                            const created = buildSmartAIItem(href, textTitle);
                            if (isOfflineNow) created.pendingOffline = true;
                            ITEMS.unshift(created);
                            added++;
                        }
                    });
                } else {
                    const rawMatches = content.match(/(?:https?:\/\/|www\.)[^\s"'<>]+/gi) || [];
                    rawMatches.forEach(rawU => {
                        const cleanU = cleanRawUrl(rawU);
                        if (!cleanU) return;
                        if (findDuplicateItem(cleanU)) {
                            dups++;
                        } else {
                            const created = buildSmartAIItem(cleanU);
                            if (isOfflineNow) created.pendingOffline = true;
                            ITEMS.unshift(created);
                            added++;
                        }
                    });
                }

                saveStateToStorage();
                renderFoldersInMenu();
                renderApp();
                closeMenuSheet();
                showToast(t('aiImportReport').replace('{added}', added).replace('{dups}', dups));
            };
            reader.readAsText(file);
        }

        function syncSheetLockUI() {
            const toggleBtn = document.getElementById('sheet-lock-toggle');
            const stateBadge = document.getElementById('sheet-lock-state');
            const lockIcon = document.getElementById('sheet-lock-icon');
            const openBtn = document.getElementById('sheet-open-btn');
            const openIcon = document.getElementById('sheet-open-icon');

            if (sheetTempLocked) {
                toggleBtn.className = 'key-press w-full py-2.5 px-3.5 rounded-lg bg-[#D96B27]/15 text-[#D96B27] border border-[#D96B27]/40 flex items-center justify-between text-xs font-bold transition';
                stateBadge.textContent = 'LOCKED';
                stateBadge.className = 'font-mono-code text-[11px] px-2 py-0.5 rounded bg-[#D96B27] text-white';
                lockIcon.innerHTML = LINE_ICONS.lock;

                openBtn.className = 'flex-1 py-3.5 px-4 rounded-lg theme-input opacity-45 cursor-not-allowed font-black text-sm sm:text-base flex items-center justify-center gap-2 transition';
                openIcon.innerHTML = LINE_ICONS.lock;
            } else {
                toggleBtn.className = 'key-press w-full py-2.5 px-3.5 rounded-lg theme-input flex items-center justify-between text-xs font-bold transition';
                stateBadge.textContent = 'OFF';
                stateBadge.className = 'font-mono-code text-[11px] px-2 py-0.5 rounded bg-black/10';
                lockIcon.innerHTML = LINE_ICONS.unlock;

                openBtn.className = 'key-press flex-1 py-3.5 px-4 rounded-lg bg-[#D96B27] text-white font-black text-sm sm:text-base flex items-center justify-center gap-2 transition';
                openIcon.innerHTML = LINE_ICONS.extArrow;
            }
        }

        function syncSheetPriorityUI() {
            const prioBtn = document.getElementById('sheet-priority-btn');
            const prioIcon = document.getElementById('sheet-priority-icon');
            const prioLabel = document.getElementById('sheet-priority-label');
            if (!prioBtn || !prioIcon || !prioLabel) return;

            if (sheetTempFolderPriority) {
                prioBtn.className = 'key-press h-9 px-2.5 rounded-lg bg-amber-500 text-white flex items-center gap-1.5 text-xs font-bold transition';
                prioIcon.innerHTML = LINE_ICONS.starFilled;
                prioLabel.textContent = t('priorityActiveBtn');
            } else {
                prioBtn.className = 'key-press h-9 px-2.5 rounded-lg theme-input flex items-center gap-1.5 text-xs font-bold transition';
                prioIcon.innerHTML = LINE_ICONS.star;
                prioLabel.textContent = t('priorityBtn');
            }
        }

        function toggleSheetItemLock() {
            sheetTempLocked = !sheetTempLocked;
            syncSheetLockUI();
        }

        function toggleSheetFolderPriority() {
            sheetTempFolderPriority = !sheetTempFolderPriority;
            syncSheetPriorityUI();
        }

        // Рендер серых ИИ-подсказок категорий + живого автодополнения по мере набора через запятую
        function renderCategorySuggestions() {
            const container = document.getElementById('sheet-cat-suggestions');
            const inputEl = document.getElementById('sheet-cat');
            if (!container || !inputEl) return;

            const rawVal = inputEl.value;
            const parts = rawVal.split(',').map(s => s.trim());
            const activeCats = parts.filter(Boolean);
            const lastToken = (parts[parts.length - 1] || '').toLowerCase();

            // 1. Все существующие в базе категории
            const allExisting = new Set();
            ITEMS.forEach(it => getItemCats(it).forEach(c => allExisting.add(c)));

            // 2. Предложенные ИИ категории для текущей редактируемой ссылки
            const currentUrl = cleanRawUrl(document.getElementById('sheet-url')?.value || '');
            const currentTitle = document.getElementById('sheet-title')?.value || '';
            const aiAnalyzed = currentUrl ? buildSmartAIItem(currentUrl, currentTitle) : null;
            const aiSuggested = new Set(aiAnalyzed?.aiSuggestedCats || []);

            // Объединяем ИИ-рекомендации и существующие категории
            const combined = Array.from(new Set([...aiSuggested, ...allExisting]));

            // Если пользователь сейчас дописывает слово после запятой — приоритизируем совпадения
            const sorted = combined.sort((a, b) => {
                const aMatch = lastToken && a.toLowerCase().includes(lastToken) ? 1 : 0;
                const bMatch = lastToken && b.toLowerCase().includes(lastToken) ? 1 : 0;
                if (aMatch !== bMatch) return bMatch - aMatch;
                const aAi = aiSuggested.has(a) ? 1 : 0;
                const bAi = aiSuggested.has(b) ? 1 : 0;
                return bAi - aAi;
            });

            container.innerHTML = sorted.map(catName => {
                const isSelected = activeCats.some(c => c.toLowerCase() === catName.toLowerCase());
                const isAiRecommended = aiSuggested.has(catName);
                const safeCat = catName.replace(/'/g, "\\'");
                return `
                    <button type="button" onclick="toggleSuggestedCategory('${safeCat}')"
                        class="key-press px-2.5 py-1 rounded-md text-xs font-mono-code font-bold flex items-center gap-1 transition border ${
                            isSelected
                                ? 'bg-[#D96B27]/15 text-[#D96B27] border-[#D96B27]/40'
                                : 'theme-input theme-muted border-transparent opacity-75 hover:opacity-100'
                        }">
                        <span>${isSelected ? '✓' : '+'}</span>
                        <span>${catName}</span>
                        ${isAiRecommended && !isSelected ? '<span class="text-[9px] uppercase opacity-70 ml-0.5">AI</span>' : ''}
                    </button>
                `;
            }).join('');
        }

        function toggleSuggestedCategory(catName) {
            const inputEl = document.getElementById('sheet-cat');
            if (!inputEl) return;
            let cats = inputEl.value.split(',').map(s => s.trim()).filter(Boolean);
            const existingIdx = cats.findIndex(c => c.toLowerCase() === catName.toLowerCase());

            if (existingIdx !== -1) {
                if (cats.length > 1) {
                    cats.splice(existingIdx, 1);
                }
            } else {
                // Если последняя часть была недописанным префиксом этой категории — заменяем её
                if (cats.length > 0) {
                    const last = cats[cats.length - 1];
                    if (catName.toLowerCase().startsWith(last.toLowerCase()) && last.length < catName.length) {
                        cats[cats.length - 1] = catName;
                    } else {
                        cats.push(catName);
                    }
                } else {
                    cats.push(catName);
                }
            }
            inputEl.value = cats.join(', ');
            renderCategorySuggestions();
        }

        function openEditSheet(id) {
            const item = ITEMS.find(x => x.id === id);
            if (!item) return;
            lockBodyScroll();
            editingId = id;
            sheetTempLocked = isItemLocked(item);
            sheetTempFolderPriority = Boolean(item.folderPriority);

            const fav = document.getElementById('sheet-favicon');
            fav.style.background = item.color;
            fav.innerHTML = item.svg;

            document.getElementById('sheet-domain').textContent = item.domain;
            document.getElementById('sheet-date').textContent = item.date;
            document.getElementById('sheet-url').value = cleanRawUrl(item.url);
            document.getElementById('sheet-title').value = item.title;
            document.getElementById('sheet-note').value = item.note;
            document.getElementById('sheet-cat').value = getItemCats(item).join(', ');
            document.getElementById('sheet-tags').value = (item.tags || []).join(' ');

            syncSheetLockUI();
            syncSheetPriorityUI();
            renderCategorySuggestions();

            const modal = document.getElementById('edit-sheet-modal');
            const panel = document.getElementById('edit-sheet-panel');
            panel.style.transform = '';
            modal.classList.remove('hidden');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('open'), 10);
        }

        function closeEditSheet() {
            const modal = document.getElementById('edit-sheet-modal');
            const panel = document.getElementById('edit-sheet-panel');
            modal.classList.remove('open');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.style.display = 'none';
                panel.style.transform = '';
                unlockBodyScrollIfNoneOpen();
            }, 340);
            editingId = null;
        }

        function regenerateAINote() {
            const item = ITEMS.find(x => x.id === editingId);
            if (!item) return;
            const currentUrl = cleanRawUrl(document.getElementById('sheet-url').value || item.url);
            const currentTitle = document.getElementById('sheet-title').value.trim();
            const smart = buildSmartAIItem(currentUrl, currentTitle);
            document.getElementById('sheet-note').value = smart.note;
            document.getElementById('sheet-cat').value = (smart.aiSuggestedCats || [smart.cat]).join(', ');
            document.getElementById('sheet-tags').value = smart.tags.join(' ');
            renderCategorySuggestions();
        }

        function saveSheet() {
            const item = ITEMS.find(x => x.id === editingId);
            if (!item) return;
            const newUrl = cleanRawUrl(document.getElementById('sheet-url').value);
            if (newUrl) {
                item.url = newUrl;
                item.domain = newUrl.replace(/^https?:\/\//i, '').replace(/^www\./i, '').split('/')[0].toLowerCase();
            }
            item.title = document.getElementById('sheet-title').value.trim() || item.title;
            item.note = document.getElementById('sheet-note').value.trim() || item.note;

            const parsedCats = document.getElementById('sheet-cat').value
                .split(',')
                .map(c => c.trim())
                .filter(Boolean);
            if (parsedCats.length > 0) {
                item.cats = Array.from(new Set(parsedCats));
                item.cat = item.cats[0];
            }

            const rawTags = document.getElementById('sheet-tags').value.trim();
            if (rawTags) {
                item.tags = rawTags.split(/\s+/).map(tg => tg.startsWith('#') ? tg : `#${tg}`);
            }

            item.lockedOverride = sheetTempLocked;
            item.folderPriority = sheetTempFolderPriority;

            saveStateToStorage();
            closeEditSheet();
            renderApp();
            showToast(t('saved'));
        }

        function deleteCurrentItem() {
            ITEMS = ITEMS.filter(x => x.id !== editingId);
            saveStateToStorage();
            closeEditSheet();
            renderApp();
            showToast(t('deleted'));
        }

        function attachSheetDrag(handleId, panelId, closeFn) {
            const handle = document.getElementById(handleId);
            const panel = document.getElementById(panelId);
            let startY = 0, currentY = 0, dragging = false;

            function onStart(e) {
                dragging = true;
                startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                panel.style.transition = 'none';
            }
            function onMove(e) {
                if (!dragging) return;
                currentY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                const diff = currentY - startY;
                if (diff > 0) panel.style.transform = `translateY(${diff}px)`;
            }
            function onEnd() {
                if (!dragging) return;
                dragging = false;
                panel.style.transition = 'transform 0.34s cubic-bezier(0.16, 1, 0.3, 1)';
                if (currentY - startY > 90) closeFn();
                else panel.style.transform = 'translateY(0)';
                startY = 0; currentY = 0;
            }

            handle.addEventListener('mousedown', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);

            handle.addEventListener('touchstart', onStart, { passive: true });
            window.addEventListener('touchmove', onMove, { passive: true });
            window.addEventListener('touchend', onEnd);
        }

        function setupPWA() {
            const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#141413"/><circle cx="50" cy="50" r="37" fill="none" stroke="#D96B27" stroke-width="11"/><path d="M 16 64 Q 24 77 38 82" fill="none" stroke="#F6F4EE" stroke-width="11"/><path d="M 84 36 Q 76 23 62 18" fill="none" stroke="#F6F4EE" stroke-width="11"/><circle cx="50" cy="50" r="30.5" fill="none" stroke="#141413" stroke-width="3.5"/><circle cx="50" cy="50" r="23" fill="none" stroke="#F6F4EE" stroke-width="11"/><path d="M 29 40 A 23 23 0 0 0 45 72" fill="none" stroke="#D96B27" stroke-width="11" stroke-linecap="round"/><path d="M 71 60 A 23 23 0 0 0 55 28" fill="none" stroke="#D96B27" stroke-width="11" stroke-linecap="round"/><circle cx="50" cy="50" r="16.5" fill="#141413"/></svg>`;
            const iconUrl = 'data:image/svg+xml;utf8,' + encodeURIComponent(svgIcon);

            const manifest = {
                name: 'LinkBox // Smart Link Organizer',
                short_name: 'LinkBox',
                description: 'Розумний ІІ-органайзер посилань та нотаток',
                start_url: window.location.href,
                display: 'standalone',
                orientation: 'portrait',
                background_color: '#ECEAE4',
                theme_color: '#ECEAE4',
                icons: [
                    { src: iconUrl, sizes: '192x192', type: 'image/svg+xml', purpose: 'any maskable' },
                    { src: iconUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }
                ]
            };

            const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
            const manifestEl = document.getElementById('pwa-manifest');
            if (manifestEl) {
                manifestEl.setAttribute('href', URL.createObjectURL(manifestBlob));
            }
        }

        window.onload = () => {
            setupPWA();
            const hadSaved = loadStateFromStorage();
            document.getElementById('lang-btn').textContent = currentLang === 'uk' ? 'UA' : 'EN';
            updateStaticTexts();
            setThemeMode(themeMode || 'light');
            const initialMode = hadSaved ? viewMode : (window.innerWidth >= 1024 ? 'large' : 'small');
            setLayoutMode(initialMode);
            setSortMode(sortMode || 'newest');
            attachSheetDrag('menu-drag-handle', 'menu-sheet-panel', closeMenuSheet);
            attachSheetDrag('tags-drag-handle', 'tags-sheet-panel', closeTagsSheet);
            attachSheetDrag('about-drag-handle', 'about-sheet-panel', closeAboutSheet);
            attachSheetDrag('edit-drag-handle', 'edit-sheet-panel', closeEditSheet);
            if (navigator.onLine) {
                processOfflineQueue(false);
            }
        };
    </script>
