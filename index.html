<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#F3F4F7" id="meta-theme-color">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="application-name" content="LinkBox">
    <title>LinkBox // Smart Link Organizer</title>
    <link rel="manifest" id="pwa-manifest">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M 44 10 L 44 50 L 58 45 L 58 21 C 58 18 61 17 66 17 C 75 17 80 22 80 30 C 80 37 74 42 58 47 L 58 58 C 76 58 82 65 82 74 C 82 82 75 87 63 87 L 48 95 C 78 95 95 87 95 72 C 95 60 86 52 72 49 C 86 45 94 37 94 26 C 94 12 81 5 63 5 C 51 5 44 7 44 10 Z' fill='%23231F20'/%3E%3Cpath d='M 6 6 L 21 21 L 21 68 C 21 78 27 84 37 84 C 46 84 52 78 55 64 L 58 76 C 53 90 43 95 29 95 C 14 95 6 84 6 66 Z' fill='%23231F20'/%3E%3Cpath d='M 44 45 L 44 22 C 44 10 54 5 68 5 C 83 5 94 14 94 28 C 94 41 83 49 58 57 C 35 65 24 72 22 80' fill='none' stroke='%23DF6D27' stroke-width='14' stroke-linecap='butt'/%3E%3Cpath d='M 64 54 C 83 54 95 62 95 74 C 95 86 83 95 62 95' fill='none' stroke='%23DF6D27' stroke-width='14' stroke-linecap='butt'/%3E%3Cpath d='M 6 58 C 6 82 20 95 41 95 C 55 95 63 85 63 63' fill='none' stroke='%23DF6D27' stroke-width='13' stroke-linecap='butt'/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: {
            accent: 'rgb(var(--accent-rgb) / <alpha-value>)',
            onaccent: 'var(--on-accent)',
            ink: 'var(--ink)',
            onink: 'var(--on-ink)'
        } } } };
    </script>
    <style>
        /* 1. СВЕТЛАЯ ТЕМА ПО УМОЛЧАНИЮ */
        :root {
            --bg-body: #F3F4F7;
            --text-main: #0F1115;
            --text-muted: #6B7280;
            --bg-surface: #FFFFFF;
            --bg-header: rgba(243, 244, 247, 0.86);
            --border-main: #E3E5EB;
            --bg-input: #ECEEF3;
            --bg-card: #FFFFFF;
            --icon-stroke: #0F1115;
            --accent-rgb: 217 107 39;
            --on-accent: #FFFFFF;
            --ink: #0F1115;
            --on-ink: #FFFFFF;
        }

        /* 2. ТЁМНАЯ ТЕМА: Светлый мягкий сланец */
        body[data-theme="dim"] {
            --bg-body: #30333C;
            --text-main: #F3F4F7;
            --text-muted: #B5BBC7;
            --bg-surface: #373B45;
            --bg-header: rgba(48, 51, 60, 0.88);
            --border-main: #4D5260;
            --bg-input: #272A32;
            --bg-card: #3E424E;
            --icon-stroke: #F3F4F7;
            --accent-rgb: 217 107 39;
            --on-accent: #FFFFFF;
            --ink: #F3F4F7;
            --on-ink: #0F1115;
        }

        /* 3. ЧЁРНАЯ ТЕМА (AMOLED) */
        body[data-theme="oled"] {
            --bg-body: #000000;
            --text-main: #F1F2F6;
            --text-muted: #80858F;
            --bg-surface: #0A0A0C;
            --bg-header: rgba(0, 0, 0, 0.88);
            --border-main: #1C1E24;
            --bg-input: #131418;
            --bg-card: #0E0F12;
            --icon-stroke: #F1F2F6;
            --accent-rgb: 217 107 39;
            --on-accent: #FFFFFF;
            --ink: #F1F2F6;
            --on-ink: #000000;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html {
            scrollbar-gutter: stable;
            overflow-x: clip;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            width: 100%;
            overflow-x: clip;
            background-color: var(--bg-body);
            color: var(--text-main);
            user-select: none;
            transition: background-color 0.2s ease, color 0.2s ease;
            overscroll-behavior-y: none;
        }

        /* Плавная физика бокового меню и оверлея */
        #app-sidebar {
            will-change: transform;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            touch-action: pan-y;
        }
        #sidebar-overlay {
            will-change: opacity;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transition: opacity 0.28s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .safe-top-header {
            padding-top: calc(max(env(safe-area-inset-top, 0px), 16px) + 0.35rem);
            padding-bottom: 0.7rem;
        }
        .safe-top-sidebar {
            padding-top: calc(max(env(safe-area-inset-top, 0px), 16px) + 0.35rem);
            padding-bottom: 0.75rem;
        }

        .font-mono-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Roboto Mono', monospace; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .theme-surface { background-color: var(--bg-surface); border-color: var(--border-main); }
        .theme-header { background-color: var(--bg-header); border-color: var(--border-main); }
        .theme-input { background-color: var(--bg-input); color: var(--text-main); }
        .theme-card { background-color: var(--bg-card); border-color: var(--border-main); }
        .theme-muted { color: var(--text-muted); }

        .mono-icon {
            stroke: var(--icon-stroke);
            fill: none;
            stroke-width: 1.75;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .key-press { transition: transform 0.12s ease, opacity 0.12s ease; }
        .key-press:active { transform: scale(0.97); }

        /* Плавные шторки снизу */
        .sheet-backdrop {
            transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
            overscroll-behavior: contain;
        }
        .sheet-panel {
            transform: translateY(100%);
            transition: transform 0.34s cubic-bezier(0.16, 1, 0.3, 1);
            overscroll-behavior: contain;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
        }
        .sheet-backdrop.open { opacity: 1; }
        .sheet-backdrop.open .sheet-panel { transform: translateY(0); }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(150, 145, 135, 0.35); border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">

    <!-- МОБИЛЬНЫЙ ОВЕРЛЕЙ БОКОВОГО МЕНЮ -->
    <div id="sidebar-overlay" onclick="closeMobileSidebar()" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-40 hidden opacity-0 md:hidden touch-none"></div>

    <!-- БОКОВОЕ МЕНЮ (ВЕРСИЯ 2.0 + ВЕСЬ ОРИГИНАЛЬНЫЙ ФУНКЦИОНАЛ) -->
    <aside id="app-sidebar" class="fixed md:sticky top-0 left-0 z-50 h-[100dvh] w-80 max-w-[86vw] theme-surface border-r flex flex-col transition-transform duration-300 ease-out -translate-x-full md:translate-x-0 shrink-0 overscroll-contain select-none">
        
        <!-- Шапка сайдбара: Фирменный прозрачный логотип LinkBox (клик сбрасывает фильтры) -->
        <div class="px-4 safe-top-sidebar border-b flex items-center justify-between gap-2 touch-none" style="border-color: var(--border-main)">
            <div onclick="resetToAllLinks(); closeMobileSidebar();" title="Показати всі посилання" class="key-press flex items-center gap-2.5 min-w-0 cursor-pointer">
                <div class="w-10 h-10 flex items-center justify-center shrink-0">
                    <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-xs">
                        <!-- Тёмные внутренние грани и стойки L и B (прозрачный фон снаружи) -->
                        <path d="M 43 48 L 58 43 L 58 18 C 69 18 76 23 76 31 C 76 39 68 44 43 52 Z" fill="#1F1D1E"/>
                        <path d="M 43 60 L 57 55 L 57 83 C 69 83 77 78 77 70 C 77 62 68 58 55 58 Z" fill="#1F1D1E"/>
                        <path d="M 6 6 L 22 22 L 22 68 C 22 77 27 83 36 83 C 45 83 51 77 54 62 L 58 75 C 53 89 43 95 29 95 C 14 95 6 83 6 65 Z" fill="#1F1D1E"/>
                        <!-- Оранжевая лента B (верхняя дуга и диагональ) -->
                        <path d="M 43 45 L 43 22 C 43 10 53 5 67 5 C 83 5 94 14 94 28 C 94 41 82 49 57 57 C 35 64 24 71 21 79" fill="none" stroke="#DF6D27" stroke-width="14" stroke-linecap="butt"/>
                        <!-- Нижняя правая оранжевая дуга B -->
                        <path d="M 63 54 C 83 54 95 62 95 74 C 95 86 82 95 60 95" fill="none" stroke="#DF6D27" stroke-width="14" stroke-linecap="butt"/>
                        <!-- Нижний оранжевый изгиб L -->
                        <path d="M 6 58 C 6 82 20 95 40 95 C 54 95 62 84 62 62" fill="none" stroke="#DF6D27" stroke-width="13" stroke-linecap="butt"/>
                    </svg>
                </div>
                <div class="min-w-0">
                    <div class="flex items-center gap-2">
                        <h1 class="text-lg font-black tracking-tight uppercase truncate">LinkBox</h1>
                        <span id="total-count-pill" class="text-xs font-mono-code font-bold px-2 py-0.5 rounded-md bg-accent text-onaccent shrink-0">6</span>
                    </div>
                    <span class="text-[11px] font-mono-code theme-muted block truncate">Smart Link Organizer</span>
                </div>
            </div>

            <button onclick="closeMobileSidebar()" class="md:hidden key-press w-9 h-9 rounded-lg theme-input flex items-center justify-center shrink-0">
                <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- Прокручиваемая часть бокового меню (Порядок: Поиск -> Категории -> Хештеги -> Всё остальное) -->
        <div id="sidebar-scroll-body" class="flex-1 overflow-y-auto overscroll-contain touch-pan-y p-4 space-y-4">

            <!-- 1. В САМОМ ВЕРХУ: Поиск (с крестиком очистки) + Кнопка Рандомайзера -->
            <div class="flex items-stretch gap-1.5">
                <div class="flex-1 flex items-center theme-input rounded-lg px-3 py-2">
                    <svg class="w-4 h-4 mono-icon mr-2 shrink-0 opacity-70" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/>
                    </svg>
                    <input id="search-input" oninput="onSearchInput()" type="text" placeholder="Пошук..." class="w-full bg-transparent text-sm outline-none font-medium min-w-0">
                    <button id="clear-search-btn" onclick="clearSearchInput()" class="hidden w-5 h-5 rounded-md items-center justify-center theme-muted hover:text-accent shrink-0 ml-1" title="Очистити пошук">✕</button>
                </div>
                <button onclick="openRandomLink()" title="Випадкове посилання" class="key-press px-3 rounded-lg theme-input flex items-center justify-center gap-1.5 font-bold text-xs hover:opacity-80 shrink-0">
                    <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24">
                        <polyline points="16 3 21 3 21 8"/>
                        <line x1="4" y1="20" x2="21" y2="3"/>
                        <polyline points="21 16 21 21 16 21"/>
                        <line x1="15" y1="15" x2="21" y2="21"/>
                        <line x1="4" y1="4" x2="9" y2="9"/>
                    </svg>
                    <span id="btn-random-label">Рандом</span>
                </button>
            </div>

            <!-- 2. КАТЕГОРИИ С ЗАМКАМИ БЛОКИРОВКИ -->
            <div class="space-y-2">
                <div class="flex items-center justify-end">
                    <button type="button" onclick="openCategoriesSheet()" title="Відкрити всі категорії" class="key-press px-3 py-1.5 rounded-lg theme-card border shadow-2xs flex items-center gap-1.5 text-xs font-mono-code font-extrabold uppercase hover:border-accent hover:text-accent transition cursor-pointer">
                        <svg class="w-3.5 h-3.5 text-accent shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                        </svg>
                        <span id="lbl-folders-section">Категорії</span>
                        <span class="text-accent text-[11px] leading-none">›</span>
                    </button>
                </div>
                <div id="folders-grid" class="grid grid-cols-1 gap-1.5">
                    <!-- Заполняется через JS -->
                </div>
            </div>

            <!-- 3. ХЕШТЕГИ -->
            <div class="space-y-2 pt-2 border-t" style="border-color: var(--border-main)">
                <div class="flex items-center justify-end">
                    <button type="button" onclick="openTagsSheet()" title="Відкрити всі хештеги" class="key-press px-3 py-1.5 rounded-lg theme-card border shadow-2xs flex items-center gap-1.5 text-xs font-mono-code font-extrabold uppercase hover:border-accent hover:text-accent transition cursor-pointer">
                        <span class="text-accent font-black leading-none">#</span>
                        <span id="lbl-hashtags-section">хештеги</span>
                        <span class="text-accent text-[11px] leading-none">›</span>
                    </button>
                </div>
                <div id="sidebar-tags-preview" class="flex flex-wrap gap-1.5">
                    <!-- Заполняется через JS -->
                </div>
            </div>

            <!-- 4. ВСЁ ОСТАЛЬНОЕ: Раскладка, Темы и Сортировка -->
            <div class="space-y-2 pt-2 border-t" style="border-color: var(--border-main)">
                <div class="flex items-center justify-between">
                    <span class="text-[11px] font-mono-code font-bold uppercase theme-muted">Вигляд та сортування</span>
                </div>
                <div class="grid grid-cols-12 gap-1.5">
                    <!-- Переключатель вида (7 колонок) -->
                    <div class="col-span-7 grid grid-cols-3 gap-1 p-1 rounded-lg theme-input">
                        <button onclick="setLayoutMode('small')" id="layout-small-btn" title="Малі картки" class="key-press py-1.5 rounded-md flex items-center justify-center text-xs font-bold transition">
                            <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                        </button>
                        <button onclick="setLayoutMode('large')" id="layout-large-btn" title="Великі картки" class="key-press py-1.5 rounded-md flex items-center justify-center text-xs font-bold transition">
                            <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6"/><rect x="3" y="14" width="18" height="6"/></svg>
                        </button>
                        <button onclick="setLayoutMode('list')" id="layout-list-btn" title="Список" class="key-press py-1.5 rounded-md flex items-center justify-center text-xs font-bold transition">
                            <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                        </button>
                    </div>

                    <!-- Переключатель тем (5 колонок) -->
                    <div class="col-span-5 grid grid-cols-3 gap-1 p-1 rounded-lg theme-input">
                        <button onclick="setThemeMode('light')" id="theme-light-btn" title="Світла тема" class="key-press py-1.5 rounded-md flex items-center justify-center transition">
                            <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="4"/>
                                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                            </svg>
                        </button>
                        <button onclick="setThemeMode('dim')" id="theme-dim-btn" title="Темна тема" class="key-press py-1.5 rounded-md flex items-center justify-center transition">
                            <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24">
                                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                            </svg>
                        </button>
                        <button onclick="setThemeMode('device')" id="theme-device-btn" title="AMOLED" class="key-press py-1.5 rounded-md flex items-center justify-center transition">
                            <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="8"/>
                                <path d="M12 4a8 8 0 0 0 0 16Z" fill="currentColor" stroke="none"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Переключатель сортировки (Нові / Старі / А–Я) -->
                <div class="grid grid-cols-3 gap-1 p-1 rounded-lg theme-input">
                    <button onclick="setSortMode('newest')" id="sort-newest-btn" class="key-press py-1.5 rounded-md text-xs font-bold transition">↓ Нові</button>
                    <button onclick="setSortMode('oldest')" id="sort-oldest-btn" class="key-press py-1.5 rounded-md text-xs font-bold transition">↑ Старі</button>
                    <button onclick="setSortMode('az')" id="sort-az-btn" class="key-press py-1.5 rounded-md text-xs font-bold transition">А–Я</button>
                </div>
            </div>
        </div>

        <!-- НИЖНИЙ ФУТЕР БОКОВОГО МЕНЮ: Импорт, Экспорт (.HTML/.JSON), Про додаток -->
        <div class="p-4 border-t space-y-2 touch-none" style="border-color: var(--border-main)">
            <!-- Выпадающая мини-плашка выбора формата экспорта -->
            <div id="export-choice-bar" class="hidden grid-cols-2 gap-1.5 p-1.5 rounded-xl theme-input">
                <button onclick="exportBrowserBookmarks()" class="key-press py-2 px-2.5 rounded-lg theme-card border text-xs font-bold flex items-center justify-center gap-1.5">
                    <span class="font-mono-code text-accent">.HTML</span>
                    <span id="lbl-exp-html">Для браузера</span>
                </button>
                <button onclick="exportFullJsonBackup()" class="key-press py-2 px-2.5 rounded-lg theme-card border text-xs font-bold flex items-center justify-center gap-1.5">
                    <span class="font-mono-code text-accent">.JSON</span>
                    <span id="lbl-exp-json">Повний бекап</span>
                </button>
            </div>

            <div class="flex items-center gap-1.5">
                <input id="ai-import-file" type="file" accept=".html,.htm,.txt,.json,.csv" class="hidden" onchange="handleAIFileImport(event)">
                
                <!-- Кнопка Импорт -->
                <button onclick="triggerAIFileImport()" class="key-press flex-1 h-10 px-2.5 rounded-lg bg-accent text-onaccent text-xs font-black flex items-center justify-center gap-1.5 min-w-0">
                    <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                        <line x1="12" y1="10" x2="12" y2="16"/>
                        <polyline points="9 13 12 16 15 13"/>
                    </svg>
                    <span id="btn-import-ai" class="truncate">Імпорт</span>
                </button>

                <!-- Кнопка Экспорт -->
                <button onclick="toggleExportChoiceBar()" class="key-press flex-1 h-10 px-2.5 rounded-lg theme-input text-xs font-bold flex items-center justify-center gap-1.5 min-w-0">
                    <svg class="w-4 h-4 mono-icon shrink-0" viewBox="0 0 24 24">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                        <line x1="12" y1="16" x2="12" y2="10"/>
                        <polyline points="9 13 12 10 15 13"/>
                    </svg>
                    <span id="btn-export-html" class="truncate">Експорт</span>
                </button>

                <!-- Кнопка «Про додаток» -->
                <button onclick="openAboutSheet()" title="Про додаток та авторські права" class="key-press w-10 h-10 rounded-lg theme-input flex items-center justify-center hover:text-accent transition shrink-0">
                    <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9"/>
                        <line x1="12" y1="16" x2="12" y2="11.5"/>
                        <circle cx="12" cy="8" r="0.6" fill="currentColor"/>
                    </svg>
                </button>
            </div>
        </div>
    </aside>

    <!-- ПРАВАЯ ОСНОВНАЯ ЧАСТЬ -->
    <div class="flex-1 flex flex-col min-w-0 w-full">

        <!-- ВЕРХНЯЯ ШАПКА -->
        <header class="sticky top-0 z-30 theme-header backdrop-blur-md border-b px-4 safe-top-header">
            <div class="max-w-5xl mx-auto flex items-center justify-between gap-2.5">
                
                <!-- Левый блок: На мобильном прозрачный логотип + активный фильтр, на ПК индикатор раздела -->
                <div class="flex items-center gap-2.5 min-w-0">
                    <div onclick="resetToAllLinks()" class="md:hidden key-press w-9 h-9 flex items-center justify-center shrink-0 cursor-pointer">
                        <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-xs">
                            <path d="M 43 48 L 58 43 L 58 18 C 69 18 76 23 76 31 C 76 39 68 44 43 52 Z" fill="#1F1D1E"/>
                            <path d="M 43 60 L 57 55 L 57 83 C 69 83 77 78 77 70 C 77 62 68 58 55 58 Z" fill="#1F1D1E"/>
                            <path d="M 6 6 L 22 22 L 22 68 C 22 77 27 83 36 83 C 45 83 51 77 54 62 L 58 75 C 53 89 43 95 29 95 C 14 95 6 83 6 65 Z" fill="#1F1D1E"/>
                            <path d="M 43 45 L 43 22 C 43 10 53 5 67 5 C 83 5 94 14 94 28 C 94 41 82 49 57 57 C 35 64 24 71 21 79" fill="none" stroke="#DF6D27" stroke-width="14" stroke-linecap="butt"/>
                            <path d="M 63 54 C 83 54 95 62 95 74 C 95 86 82 95 60 95" fill="none" stroke="#DF6D27" stroke-width="14" stroke-linecap="butt"/>

        // Плавное задвигание бокового меню пальцем влево (и свайп по оверлею) без дергания основного интерфейса
        function attachSidebarSwipe() {
            const sb = document.getElementById('app-sidebar');
            const ov = document.getElementById('sidebar-overlay');
            if (!sb || !ov) return;

            let startX = 0;
            let startY = 0;
            let currentDx = 0;
            let tracking = false;
            let isHorizontalDrag = null;
            let sidebarWidth = 320;

            function onTouchStart(e) {
                if (window.innerWidth >= 768 || !isMobileSidebarOpen) return;
                if (e.touches.length !== 1) return;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                currentDx = 0;
                tracking = true;
                isHorizontalDrag = null;
                sidebarWidth = sb.offsetWidth || 320;
            }

            function onTouchMove(e) {
                if (!tracking || !isMobileSidebarOpen) return;
                const x = e.touches[0].clientX;
                const y = e.touches[0].clientY;
                const dx = x - startX;
                const dy = y - startY;

                if (isHorizontalDrag === null) {
                    if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
                        // Захватываем горизонтальный жест увода меню влево
                        isHorizontalDrag = Math.abs(dx) > Math.abs(dy) && dx < 0;
                    }
                }

                if (isHorizontalDrag) {
                    if (e.cancelable) e.preventDefault();
                    currentDx = Math.min(0, Math.max(-sidebarWidth, dx));
                    sb.style.transition = 'none';
                    ov.style.transition = 'none';
                    sb.style.transform = `translate3d(${currentDx}px, 0, 0)`;
                    const progress = 1 - Math.abs(currentDx) / sidebarWidth;
                    ov.style.opacity = String(Math.max(0, Math.min(1, progress)));
                }
            }

            function onTouchEnd() {
                if (!tracking) return;
                tracking = false;
                if (!isHorizontalDrag) return;

                if (currentDx < -sidebarWidth * 0.24) {
                    closeMobileSidebar();
                } else {
                    openMobileSidebar();
                }
                currentDx = 0;
                isHorizontalDrag = null;
            }

            sb.addEventListener('touchstart', onTouchStart, { passive: true });
            sb.addEventListener('touchmove', onTouchMove, { passive: false });
            sb.addEventListener('touchend', onTouchEnd, { passive: true });
            sb.addEventListener('touchcancel', onTouchEnd, { passive: true });

            ov.addEventListener('touchstart', onTouchStart, { passive: true });
            ov.addEventListener('touchmove', onTouchMove, { passive: false });
            ov.addEventListener('touchend', onTouchEnd, { passive: true });
            ov.addEventListener('touchcancel', onTouchEnd, { passive: true });

            window.addEventListener('resize', () => {
                if (window.innerWidth >= 768) {
                    sb.style.transform = '';
                    sb.style.transition = '';
                    ov.classList.add('hidden');
                    ov.style.opacity = '0';
                    isMobileSidebarOpen = false;
                    unlockBodyScrollIfNoneOpen();
                }
            });
        }


        // Открытие бокового меню свайпом вправо (палец ведёт шторку), закрытие — attachSidebarSwipe
        function attachSidebarOpenSwipe() {
            const sb = document.getElementById('app-sidebar');
            const ov = document.getElementById('sidebar-overlay');
            if (!sb || !ov) return;

            let startX = 0, startY = 0, dx = 0, tracking = false, dragging = null, sbW = 320;

            function blocked(target) {
                if (window.innerWidth >= 768 || isMobileSidebarOpen) return true;
                if (document.querySelector('.sheet-backdrop.open')) return true;
                for (let el = target; el && el !== document.body; el = el.parentElement) {
                    if (!(el instanceof HTMLElement)) continue;
                    if (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return true;
                    const ox = getComputedStyle(el).overflowX;
                    if ((ox === 'auto' || ox === 'scroll') && el.scrollWidth > el.clientWidth + 2) return true;
                }
                return false;
            }

            document.addEventListener('touchstart', (e) => {
                if (e.touches.length !== 1 || blocked(e.target)) { tracking = false; return; }
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                dx = 0; dragging = null; tracking = true;
                sbW = sb.offsetWidth || 320;
            }, { passive: true });

            document.addEventListener('touchmove', (e) => {
                if (!tracking) return;
                const mx = e.touches[0].clientX - startX;
                const my = e.touches[0].clientY - startY;
                if (dragging === null) {
                    if (Math.abs(mx) < 10 && Math.abs(my) < 10) return;
                    dragging = mx > 0 && Math.abs(mx) > Math.abs(my) * 1.6;
                    if (dragging) {
                        lockBodyScroll();
                        ov.classList.remove('hidden');
                        sb.classList.remove('-translate-x-full');
                        sb.style.transition = 'none';
                        ov.style.transition = 'none';
                    }
                }
                if (!dragging) { if (dragging === false) tracking = false; return; }
                if (e.cancelable) e.preventDefault();
                dx = Math.max(0, Math.min(sbW, mx));
                sb.style.transform = `translate3d(${dx - sbW}px, 0, 0)`;
                ov.style.opacity = String(dx / sbW);
            }, { passive: false });

            function end() {
                if (!tracking) return;
                tracking = false;
                if (!dragging) return;
                dragging = null;
                if (dx > sbW * 0.28) {
                    openMobileSidebar();
                } else {
                    sb.style.transition = 'transform 0.28s cubic-bezier(0.22, 1, 0.36, 1)';
                    ov.style.transition = 'opacity 0.26s cubic-bezier(0.22, 1, 0.36, 1)';
                    sb.style.transform = '';
                    sb.classList.add('-translate-x-full');
                    ov.style.opacity = '0';
                    setTimeout(() => {
                        if (!isMobileSidebarOpen) {
                            ov.classList.add('hidden');
                            unlockBodyScrollIfNoneOpen();
                        }
                    }, 280);
                }
                dx = 0;
            }
            document.addEventListener('touchend', end, { passive: true });
            document.addEventListener('touchcancel', end, { passive: true });
        }

        function getItemCats(item) {
            if (Array.isArray(item.cats) && item.cats.length > 0) {
                return item.cats.map(c => String(c).trim()).filter(Boolean);
            }
            if (typeof item.cat === 'string' && item.cat.trim()) {
                return item.cat.split(',').map(c => c.trim()).filter(Boolean);
            }
            return ['Веб-ресурси'];
        }

        function cleanRawUrl(raw) {
            let u = (raw || '').trim();
            u = u.replace(/^[,\s"'<>()[\]{};:]+|[,\s"'<>()[\]{}.;:]+$/g, '');
            if (!u) return '';
            if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
            return u;
        }

        function faviconNext(img) {
            img.dataset.g = '';
            const list = (img.dataset.fb || '').split('|').filter(Boolean);
            if (list.length) {
                img.src = list.shift();
                img.dataset.fb = list.join('|');
                return;
            }
            const keep = img.dataset.keep;
            if (keep) {
                img.dataset.keep = '';
                img.src = keep;
                return;
            }
            img.style.display = 'none';
            if (img.nextElementSibling) img.nextElementSibling.style.display = 'flex';
        }

        // Google при отсутствии иконки отдаёт серый глобус 16x16 (не ошибку) — пробуем другие источники
        function faviconLoaded(img) {
            if (img.dataset.g === '1' && img.naturalWidth <= 16 && (img.dataset.fb || '')) {
                if (!img.dataset.keep) img.dataset.keep = img.src;
                faviconNext(img);
            }
        }

        function getSiteFaviconHtml(item, sizeClass = 'w-5 h-5', imgSizeClass = 'w-4 h-4') {
            const cleanDom = (item.domain || 'example.com').replace(/^www\./i, '');
            const first = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(cleanDom)}&sz=64`;
            const rest = [
                `https://${cleanDom}/favicon.ico`,
                `https://icons.duckduckgo.com/ip3/${cleanDom}.ico`,
                `https://favicone.com/${cleanDom}?s=64`
            ].join('|');
            return `
                <span class="${sizeClass} rounded-lg flex items-center justify-center overflow-hidden shrink-0 bg-white/95 border border-black/10 shadow-2xs relative">
                    <img src="${first}" data-g="1" data-fb="${rest}" alt="" referrerpolicy="no-referrer" decoding="async" class="${imgSizeClass} object-contain"
                        onload="faviconLoaded(this)" onerror="faviconNext(this)">
                    <span style="display:none; color:#8A8F9A" class="w-full h-full items-center justify-center">${LINE_ICONS.globe}</span>
                </span>
            `;
        }

        function saveStateToStorage() {
            try {
                const payload = {
                    items: ITEMS,
                    lockedFolders: Array.from(LOCKED_FOLDERS),
                    themeMode,
                    viewMode,
                    sortMode
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
            } catch (e) {}
        }

        function loadStateFromStorage() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('linkbox_hyperos_v2') || localStorage.getItem('linkbox_hyperos_v1');
                if (!raw) return false;
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed.items)) {
                    ITEMS = parsed.items.map(it => {
                        const cleanedUrl = cleanRawUrl(it.url);
                        const normCats = getItemCats(it);
                        return {
                            ...it,
                            url: cleanedUrl,
                            cat: normCats[0],
                            cats: normCats,
                            pinned: Boolean(it.pinned),
                            folderPriority: Boolean(it.folderPriority),
                            pendingOffline: Boolean(it.pendingOffline)
                        };
                    });
                }
                if (Array.isArray(parsed.lockedFolders)) LOCKED_FOLDERS = new Set(parsed.lockedFolders);
                if (parsed.themeMode) themeMode = parsed.themeMode;
                if (parsed.viewMode) viewMode = parsed.viewMode;
                if (parsed.sortMode) sortMode = parsed.sortMode;
                return true;
            } catch (e) {
                return false;
            }
        }

        function openExternalUrlInNewTab(rawUrl) {
            const finalUrl = cleanRawUrl(rawUrl);
            if (!finalUrl) return;
            const a = document.createElement('a');
            a.href = finalUrl;
            a.target = '_blank';
            a.rel = 'noopener noreferrer external';
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                if (a.parentNode) a.parentNode.removeChild(a);
            }, 150);
        }

        function getFilteredItems() {
            const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
            let filtered = [];
            if (selectedFolder === 'ALL') {
                filtered = [...ITEMS];
            } else if (selectedFolder === OFFLINE_FOLDER_KEY) {
                filtered = ITEMS.filter(i => i.pendingOffline);
            } else {
                filtered = ITEMS.filter(i => getItemCats(i).includes(selectedFolder));
            }

            if (selectedTag) {
                filtered = filtered.filter(i => Array.isArray(i.tags) && i.tags.some(tg => tg.toLowerCase() === selectedTag.toLowerCase()));
            }
            if (q) {
                filtered = filtered.filter(i =>
                    [i.name, i.domain, i.title, ...getItemCats(i), i.note, ...(i.tags || [])].join(' ').toLowerCase().includes(q)
                );
            }

            if (sortMode === 'oldest') {
                filtered.reverse();
            } else if (sortMode === 'az') {
                filtered.sort((a, b) => (a.title || a.name).localeCompare(b.title || b.name, 'uk'));
            }

            filtered.sort((a, b) => (b.folderPriority ? 1 : 0) - (a.folderPriority ? 1 : 0));
            return filtered;
        }

        function renderCategoriesCloud() {
            const container = document.getElementById('cats-cloud-container');
            if (!container) return;
            const q = (document.getElementById('cats-search-input')?.value || '').trim().toLowerCase();

            const catMap = new Map();
            ITEMS.forEach(item => {
                getItemCats(item).forEach(cName => {
                    if (!catMap.has(cName)) {
                        catMap.set(cName, { cat: cName, color: item.color, count: 0 });
                    }
                    catMap.get(cName).count += 1;
                });
            });

            let cats = Array.from(catMap.values());
            if (q) {
                cats = cats.filter(c => c.cat.toLowerCase().includes(q));
            }

            if (catsSortMode === 'popular') {
                cats.sort((a, b) => b.count - a.count || a.cat.localeCompare(b.cat, 'uk'));
            } else if (catsSortMode === 'az') {
                cats.sort((a, b) => a.cat.localeCompare(b.cat, 'uk'));
            } else if (catsSortMode === 'za') {
                cats.sort((a, b) => b.cat.localeCompare(a.cat, 'uk'));
            }

            const isAll = selectedFolder === 'ALL' && !selectedTag;
            let html = `
                <button onclick="selectCategoryFromSheet('ALL')" class="key-press rounded-lg px-3.5 py-2.5 flex items-center justify-between transition ${
                    isAll ? 'bg-accent text-onaccent' : 'theme-input'
                }">
                    <span class="text-xs sm:text-sm font-bold">${t('allFolders')}</span>
                    <span class="text-xs font-mono-code font-bold opacity-80">${ITEMS.length}</span>
                </button>
            `;

            html += cats.map(c => {
                const active = selectedFolder === c.cat;
                const folderLocked = LOCKED_FOLDERS.has(c.cat);
                const safeCat = c.cat.replace(/'/g, "\\'");
                return `
                    <div class="rounded-lg flex items-stretch overflow-hidden ${active ? 'text-white' : 'theme-input'}"
                        style="${active ? `background:${c.color};` : ''}">
                        <button onclick="selectCategoryFromSheet('${safeCat}')" class="key-press flex-1 px-3.5 py-2.5 text-left flex items-center justify-between min-w-0">
                            <div class="flex items-center gap-2.5 min-w-0">
                                <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${active ? '#fff' : c.color}"></span>
                                <span class="text-xs sm:text-sm font-bold truncate">${c.cat}</span>
                            </div>
                            <span class="text-xs font-mono-code font-bold opacity-75 ml-2">${c.count}</span>
                        </button>
                        <button onclick="toggleFolderLock('${safeCat}', event)" title="Блокувати / розблокувати прямий перехід у папці"
                            class="key-press px-3 border-l flex items-center justify-center transition ${
                                folderLocked
                                    ? (active ? 'bg-black/25 text-white' : 'bg-accent/15 text-accent')
                                    : 'opacity-45 hover:opacity-100'
                            }" style="border-color: var(--border-main)">
                            ${folderLocked ? LINE_ICONS.lock : LINE_ICONS.unlock}
                        </button>
                    </div>
                `;
            }).join('');

            container.innerHTML = html;
        }

        function getTagMapSorted(sortBy = 'popular', filterQ = '') {
            const tagCounts = new Map();
            ITEMS.forEach(item => {
                (item.tags || []).forEach(rawTag => {
                    const clean = rawTag.trim();
                    if (!clean) return;
                    const key = clean.toLowerCase();
                    const prev = tagCounts.get(key) || { label: clean, count: 0 };
                    prev.count += 1;
                    tagCounts.set(key, prev);
                });
            });

            let arr = Array.from(tagCounts.values());
            if (filterQ) {
                const q = filterQ.toLowerCase();
                arr = arr.filter(tObj => tObj.label.toLowerCase().includes(q));
            }

            if (sortBy === 'popular') {
                arr.sort((a, b) => b.count - a.count || a.label.localeCompare(b.label));
            } else if (sortBy === 'az') {
                arr.sort((a, b) => a.label.localeCompare(b.label));
            } else if (sortBy === 'za') {
                arr.sort((a, b) => b.label.localeCompare(a.label));
            }
            return arr;
        }

            temp.value = clean;

            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            showToast(t('copied') + clean);
        }

        function exportBrowserBookmarks() {
            const foldersMap = {};
            ITEMS.forEach(item => {
                getItemCats(item).forEach(catName => {
                    if (!foldersMap[catName]) foldersMap[catName] = [];
                    foldersMap[catName].push(item);
                });
            });
            const nowUnix = Math.floor(Date.now() / 1000);
            let html = `<!DOCTYPE NETSCAPE-Bookmark-file-1><META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8"><TITLE>LinkBox Bookmarks</TITLE><H1>LinkBox</H1><DL><p>\n`;
            Object.keys(foldersMap).forEach(cat => {
                html += `    <DT><H3 ADD_DATE="${nowUnix}">${cat}</H3>\n    <DL><p>\n`;
                foldersMap[cat].forEach(item => {
                    html += `        <DT><A HREF="${cleanRawUrl(item.url)}" ADD_DATE="${nowUnix}">${item.name} — ${item.title}</A>\n<DD>${item.note}\n`;
                });
                html += `    </DL><p>\n`;
            });
            html += `</DL><p>\n`;

            const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `linkbox_bookmarks.html`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast(t('exported'));
            closeMobileSidebar();
        }

                items: ITEMS,
                lockedFolders: Array.from(LOCKED_FOLDERS),
                themeMode,

            link.href = URL.createObjectURL(blob);
            link.download = `linkbox_backup_${new Date().toISOString().slice(0, 10)}.json`;

        function normalizeUrlForCompare(raw) {
            return cleanRawUrl(raw).replace(/^https?:\/\//i, '').replace(/^www\./i, '').replace(/\/+$/, '').toLowerCase();

        function findDuplicateItem(rawUrl) {
            const target = normalizeUrlForCompare(rawUrl);
            if (!target) return null;
            return ITEMS.find(item => normalizeUrlForCompare(item.url) === target) || null;
        }

        function extractCleanBrandName(domain) {
            const parts = domain.split('.').filter(p => !['www', 'm', 'mobile', 'ua', 'com', 'net', 'org', 'gov', 'edu', 'info', 'io', 'co', 'uk', 'ru', 'it', 'de', 'fr', 'es', 'pl', 'biz'].includes(p));
            const root = parts.length > 0 ? parts[parts.length - 1] : domain.split('.')[0];
            if (!root) return 'Site';
            const mainBrand = root.charAt(0).toUpperCase() + root.slice(1);
            if (parts.length > 1) {
                const sub = parts[0].toLowerCase();
                const subMap = {
                    techno: 'Techno', life: 'Life', sport: 'Sport', auto: 'Auto',
                    health: 'Health', style: 'Style', travel: 'Travel', music: 'Music', books: 'Books'
                };
                if (subMap[sub]) return `${mainBrand} ${subMap[sub]}`;
            }
            return mainBrand;
        }

        function detectSiteLanguage(finalUrl, domain, humanTitle, slugTopic) {
            const lowerUrl = finalUrl.toLowerCase();
            const combinedText = `${humanTitle} ${slugTopic}`.trim();

            if (/\/(it|it-it|italiano)(\/|$)/i.test(lowerUrl)) return 'it';
            if (/\/(uk|ua|uk-ua)(\/|$)/i.test(lowerUrl)) return 'uk';
            if (/\/(ru|ru-ru)(\/|$)/i.test(lowerUrl)) return 'ru';
            if (/\/(de|de-de)(\/|$)/i.test(lowerUrl)) return 'de';
            if (/\/(fr|fr-fr)(\/|$)/i.test(lowerUrl)) return 'fr';
            if (/\/(es|es-es)(\/|$)/i.test(lowerUrl)) return 'es';
            if (/\/(pl|pl-pl)(\/|$)/i.test(lowerUrl)) return 'pl';
            if (/\/(en|en-us|en-gb)(\/|$)/i.test(lowerUrl)) return 'en';

            if (/[іїєґ]/i.test(combinedText)) return 'uk';
            if (/[ыъэё]/i.test(combinedText)) return 'ru';
            if (/[а-я]/i.test(combinedText)) {
                if (/\b(лучших|лучшие|самые|самых|века|романов|чтение|воскресное|смешные|заголовки|каналы|выбор|редакции|недорогой|купить|обзор|новости|технологии)\b/i.test(combinedText)) return 'ru';
                if (/\b(найкращі|століття|недільне|читання|смішні|канали|вибір|редакції|недорогий|купити|огляд|новини|технології|посилання)\b/i.test(combinedText)) return 'uk';
                if (/\.(ru|su|by|рф)$/i.test(domain)) return 'ru';
                return 'uk';
            }

            if (/\.(it|sm|va)$/i.test(domain) || /(repubblica|corriere|gazzetta|ansa|subito|raiplay|ilpost|fanpage|giallozafferano|trovaprezzi|aranzulla)\./i.test(domain)) return 'it';
            if (/\.(ru|su|рф)$/i.test(domain) || /(habr|kinopoisk|yandex|dzen|vc\.ru|rbc\.ru|lenta\.ru|ozon|wildberries|avito|4pda)\./i.test(domain)) return 'ru';
            if (/\.(ua|укр)$/i.test(domain) || /(rozetka|pravda\.com\.ua|nv\.ua|unian|tsn\.ua|dou\.ua|itc\.ua|ain\.ua|prom\.ua|monobank|privatbank|sinoptik|liga\.net|censor\.net|babel\.ua|hromadske)\b/i.test(domain)) return 'uk';
            if (/\b(della|delle|degli|nella|nelle|sulla|sono|anche|questo|questa|migliori|notizie|ricette|comprare|prezzo|storia|italia|italiano|guida|come)\b/i.test(combinedText)) return 'it';

            return 'en';
        }

        function decodeUrlPathToHumanTopic(urlStr) {
            try {
                const u = new URL(cleanRawUrl(urlStr));
                const segments = u.pathname.split('/').filter(Boolean);
                if (segments.length === 0) return { topic: '', sectionHint: '', isRussianTranslit: false };

                let slug = decodeURIComponent(segments[segments.length - 1]);
                slug = slug.replace(/\.(html?|php|aspx?|jsp)$/i, '');
                slug = slug.replace(/(?:^|[-_])\d{4,}(?=$|[-_])/g, '');
                slug = slug.replace(/^\d+[-_]/, '');

                const sectionRaw = segments.length > 1 ? segments.slice(0, -1).join(' ').toLowerCase() : '';
                const words = slug.split(/[-_]+/).filter(w => w.length > 0 && !/^\d+$/.test(w));
                if (words.length < 2) return { topic: '', sectionHint: sectionRaw, isRussianTranslit: false };

                if (/[а-яіїєґ]/i.test(slug)) {
                    const cleanCyr = words.join(' ');
                    return {
                        topic: cleanCyr.charAt(0).toUpperCase() + cleanCyr.slice(1),
                        sectionHint: sectionRaw,
                        isRussianTranslit: /[ыъэё]/i.test(cleanCyr)
                    };
                }

                const SLUG_DICT = {
                    'luchshih': 'лучших', 'luchshie': 'лучшие', 'samye': 'самые', 'samyh': 'самых',
                    'nauchno': 'научно', 'fantasticheskih': 'фантастических', 'romanov': 'романов',
                    'knig': 'книг', 'knigi': 'книги', 'xxi': 'XXI', 'veka': 'века', 'chtivo': 'чтиво',
                    'voskresnoje': 'воскресное', 'smeshnye': 'смешные', 'zagolovki': 'заголовки',
                    'ukrainskiy': 'украинский', 'ukrainskie': 'украинские', 'shou': 'шоу', 'biz': 'биз',
                    'memy': 'мемы', 'pro': 'про', 'literaturu': 'литературу', 'veselye': 'весёлые',
                    'kanaly': 'каналы', 'telegram': 'Telegram', 'vybor': 'выбор', 'redakcii': 'редакции',
                    'kakie': 'какие', 'sajty': 'сайты', 'rabotayut': 'работают', 'ukraine': 'Украине',
                    'ukraina': 'Украина', 'besplatno': 'бесплатно', 'onlajn': 'онлайн', 'smotret': 'смотреть',
                    'serialy': 'сериалы', 'filmy': 'фильмы', 'kino': 'кино', 'novosti': 'новости',
                    'tehnologii': 'технологии', 'gadzhety': 'гаджеты', 'smartfony': 'смартфоны',
                    'obzor': 'обзор', 'reyting': 'рейтинг', 'top': 'ТОП', 'kak': 'как', 'chto': 'что',
                    'gde': 'где', 'kogda': 'когда', 'pochemu': 'почему', 'sovety': 'советы',
                    'instrukciya': 'инструкция', 'recepty': 'рецепты', 'igry': 'игры', 'muzyka': 'музыка',
                    'nauka': 'наука', 'kosmos': 'космос', 'istoriya': 'история', 'ekonomika': 'экономика',
                    'biznes': 'бизнес', 'kriptovalyuta': 'криптовалюта', 'kurs': 'курс', 'valyut': 'валют',
                    'nedorogoy': 'недорогой', 'kupit': 'купить', 'cena': 'цена'
                };

                const hasRuDictMatch = words.some(w => Boolean(SLUG_DICT[w.toLowerCase()]));
                const isTranslitLike = hasRuDictMatch || words.filter(w => /(shch|zh|kh|vo|oje|yye|ih|yh)$/i.test(w)).length >= 2;

                function translitWordToCyr(w) {
                    const low = w.toLowerCase();
                    if (SLUG_DICT[low]) return SLUG_DICT[low];
                    if (['ai', 'ui', 'ux', 'it', 'ios', 'android', 'apk', 'pc', 'tv', 'usb', 'wifi', 'vpn', 'gpt', 'telegram', 'youtube', 'netflix', 'spotify', 'starlink', 'ecoflow'].includes(low)) {
                        return w.toUpperCase() === w ? w : (w.charAt(0).toUpperCase() + w.slice(1));
                    }
                    let s = low
                        .replace(/shch/g, 'щ').replace(/yo/g, 'ё').replace(/zh/g, 'ж').replace(/kh/g, 'х')
                        .replace(/ts/g, 'ц').replace(/ch/g, 'ч').replace(/sh/g, 'ш').replace(/yu/g, 'ю')
                        .replace(/ya/g, 'я').replace(/je/g, 'е').replace(/iy/g, 'ий').replace(/yy/g, 'ый')
                        .replace(/aya/g, 'ая').replace(/oye/g, 'ое');
                    const map = {
                        a:'а', b:'б', v:'в', g:'г', d:'д', e:'е', z:'з', i:'и', j:'й', y:'й',
                        k:'к', l:'л', m:'м', n:'н', o:'о', p:'п', r:'р', s:'с', t:'т', u:'у',
                        f:'ф', h:'х', c:'ц', w:'в', x:'кс', q:'к'
                    };
                    let out = '';
                    for (const ch of s) out += map[ch] || ch;
                    return out;
                }

                const converted = words.slice(0, 11).map(w => isTranslitLike ? translitWordToCyr(w) : w);
                let phrase = converted.join(' ').trim();
                if (phrase) phrase = phrase.charAt(0).toUpperCase() + phrase.slice(1);
                return { topic: phrase, sectionHint: sectionRaw, isRussianTranslit: isTranslitLike };
            } catch (e) {
                return { topic: '', sectionHint: '', isRussianTranslit: false };
            }
        }

            tStr = tStr.replace(/[,\s]+$/g, '');
            if (/—\s*[a-z0-9_-]+\s+\d{4,}/i.test(tStr)) return '';
            if (tStr.length < 2) return '';
            return tStr;
        }

        async function enrichItemWithLiveTitle(itemId, targetUrl) {
            if (!navigator.onLine) return false;
            try {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 3500);
                const resp = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(targetUrl)}`, { signal: controller.signal });
                clearTimeout(timer);
                if (resp.ok) {
                    const data = await resp.json();
                    const idx = ITEMS.findIndex(x => x.id === itemId);
                    if (idx !== -1) {
                        const updated = buildSmartAIItem(targetUrl, data && data.title ? data.title : '');
                        ITEMS[idx] = {
                            ...updated,
                            id: itemId,
                            date: ITEMS[idx].date,
                            lockedOverride: ITEMS[idx].lockedOverride,
                            pinned: ITEMS[idx].pinned,
                            folderPriority: ITEMS[idx].folderPriority,
                            pendingOffline: false
                        };
                        saveStateToStorage();
                        renderApp();
                        return true;
                    }
                }
            } catch (e) {}
            const idx = ITEMS.findIndex(x => x.id === itemId);
            if (idx !== -1 && ITEMS[idx].pendingOffline) {
                const rebuilt = buildSmartAIItem(targetUrl, ITEMS[idx].title);
                ITEMS[idx] = {
                    ...rebuilt,
                    id: itemId,
                    date: ITEMS[idx].date,
                    lockedOverride: ITEMS[idx].lockedOverride,
                    pinned: ITEMS[idx].pinned,
                    folderPriority: ITEMS[idx].folderPriority,
                    pendingOffline: false
                };
                saveStateToStorage();
                renderApp();
                return true;
            }
            return false;
        }

        async function processOfflineQueue(manualTap = false) {
            const pending = ITEMS.filter(i => i.pendingOffline);
            if (pending.length === 0) return;

            if (!navigator.onLine) {
                if (manualTap) {
                    selectedFolder = OFFLINE_FOLDER_KEY;
                    renderApp();
                    showToast(t('offlineStillNoNet'));
                }
                return;
            }

            let processedCount = 0;
            for (const item of pending) {
                const ok = await enrichItemWithLiveTitle(item.id, item.url);
                if (ok) processedCount++;
            }

            if (processedCount > 0) {
                if (selectedFolder === OFFLINE_FOLDER_KEY && ITEMS.filter(i => i.pendingOffline).length === 0) {
                    selectedFolder = 'ALL';
                }
                saveStateToStorage();
                renderApp();
                showToast(`${t('offlineSyncedToast')}${processedCount} ✓`);
            }
        }

        window.addEventListener('online', () => {
            processOfflineQueue(false);
        });

        function addLinkByAI() {
            const input = document.getElementById('url-input');
            const rawText = input.value.trim();
            if (!rawText) return;

            const isOfflineNow = !navigator.onLine;
            const urlMatches = rawText.match(/(?:https?:\/\/|www\.)[^\s"'<>]+/gi);
            const rawCandidates = urlMatches && urlMatches.length > 0 ? urlMatches : [rawText];
            const candidates = rawCandidates.map(u => cleanRawUrl(u)).filter(Boolean);

            if (candidates.length === 1) {
                const singleUrl = candidates[0];
                const existing = findDuplicateItem(singleUrl);
                if (existing) {
                    showToast(`${t('duplicateFound')}${existing.name} (${getItemCats(existing).join(', ')})`);
                    highlightExistingCard(existing);
                    return;
                }
                const newItem = buildSmartAIItem(singleUrl);
                if (isOfflineNow) {
                    newItem.pendingOffline = true;
                }
                ITEMS.unshift(newItem);
                input.value = '';
                saveStateToStorage();
                renderApp();
                if (isOfflineNow) {
                    showToast(t('aiAddedOffline'));
                } else {
                    showToast(t('aiAddedSingle').replace('{cat}', newItem.cat).replace('{lang}', newItem.siteLang || 'AUTO'));
                    enrichItemWithLiveTitle(newItem.id, singleUrl);
                }
            } else if (candidates.length > 1) {
                let added = 0;
                let dups = 0;
                candidates.forEach(u => {
                    if (findDuplicateItem(u)) {
                        dups++;
                    } else {
                        const created = buildSmartAIItem(u);
                        if (isOfflineNow) {
                            created.pendingOffline = true;
                        } else {
                            enrichItemWithLiveTitle(created.id, u);
                        }
                        ITEMS.unshift(created);
                        added++;
                    }
                });
                input.value = '';
                saveStateToStorage();
                renderApp();
                showToast(isOfflineNow ? t('aiAddedOffline') : t('aiImportReport').replace('{added}', added).replace('{dups}', dups));
            }
        }

        function handleAIFileImport(event) {
            const file = event.target.files?.[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const content = String(e.target?.result || '');

                try {
                    const maybeJson = JSON.parse(content);
                    if (maybeJson && Array.isArray(maybeJson.items)) {
                        let added = 0;
                        let dups = 0;
                        maybeJson.items.forEach(it => {
                            if (findDuplicateItem(it.url)) {
                                dups++;
                            } else {
                                const normCats = getItemCats(it);
                                ITEMS.push({
                                    ...it,
                                    url: cleanRawUrl(it.url),
                                    cat: normCats[0],
                                    cats: normCats,
                                    pinned: Boolean(it.pinned),
                                    folderPriority: Boolean(it.folderPriority),
                                    pendingOffline: Boolean(it.pendingOffline)
                                });
                                added++;
                            }
                        });
                        if (Array.isArray(maybeJson.lockedFolders)) {
                            maybeJson.lockedFolders.forEach(f => LOCKED_FOLDERS.add(f));
                        }
                        saveStateToStorage();
                        renderFoldersInMenu();
                        renderApp();
                        closeMobileSidebar();
                        showToast(t('restoredJson') + `+${added} (${dups} dups)`);
                        return;
                    }
                } catch (err) {}

                const parser = new DOMParser();
                const doc = parser.parseFromString(content, 'text/html');
                const anchors = Array.from(doc.querySelectorAll('a[href]'));

                let added = 0;
                let dups = 0;
                const isOfflineNow = !navigator.onLine;

                if (anchors.length > 0) {
                    anchors.forEach(a => {
                        const href = cleanRawUrl(a.getAttribute('href') || '');
                        if (!/^https?:\/\//i.test(href)) return;
                        if (findDuplicateItem(href)) {
                            dups++;
                        } else {
                            const textTitle = (a.textContent || '').trim();
                            const created = buildSmartAIItem(href, textTitle);
                            if (isOfflineNow) created.pendingOffline = true;
                            ITEMS.unshift(created);
                            added++;
                        }
                    });
                } else {
                    const rawMatches = content.match(/(?:https?:\/\/|www\.)[^\s"'<>]+/gi) || [];
                    rawMatches.forEach(rawU => {
                        const cleanU = cleanRawUrl(rawU);
                        if (!cleanU) return;
                        if (findDuplicateItem(cleanU)) {
                            dups++;
                        } else {
                            const created = buildSmartAIItem(cleanU);
                            if (isOfflineNow) created.pendingOffline = true;
                            ITEMS.unshift(created);
                            added++;
                        }
                    });
                }

                saveStateToStorage();
                renderFoldersInMenu();
                renderApp();
                closeMobileSidebar();
                showToast(t('aiImportReport').replace('{added}', added).replace('{dups}', dups));
            };
            reader.readAsText(file);
        }

        function renderCategorySuggestions() {
            const container = document.getElementById('sheet-cat-suggestions');
            const inputEl = document.getElementById('sheet-cat');
            if (!container || !inputEl) return;

            const rawVal = inputEl.value;
            const parts = rawVal.split(',').map(s => s.trim());
            const activeCats = parts.filter(Boolean);
            const lastToken = (parts[parts.length - 1] || '').toLowerCase();

            const allExisting = new Set();
            ITEMS.forEach(it => getItemCats(it).forEach(c => allExisting.add(c)));

            const currentUrl = cleanRawUrl(document.getElementById('sheet-url')?.value || '');
            const currentTitle = document.getElementById('sheet-title')?.value || '';
            const aiAnalyzed = currentUrl ? buildSmartAIItem(currentUrl, currentTitle) : null;
            const aiSuggested = new Set(aiAnalyzed?.aiSuggestedCats || []);

            const combined = Array.from(new Set([...aiSuggested, ...allExisting]));

            const sorted = combined.sort((a, b) => {
                const aMatch = lastToken && a.toLowerCase().includes(lastToken) ? 1 : 0;
                const bMatch = lastToken && b.toLowerCase().includes(lastToken) ? 1 : 0;
                if (aMatch !== bMatch) return bMatch - aMatch;
                const aAi = aiSuggested.has(a) ? 1 : 0;
                const bAi = aiSuggested.has(b) ? 1 : 0;
                return bAi - aAi;
            });

            container.innerHTML = sorted.map(catName => {
                const isSelected = activeCats.some(c => c.toLowerCase() === catName.toLowerCase());
                const isAiRecommended = aiSuggested.has(catName);
                const safeCat = catName.replace(/'/g, "\\'");
                return `
                    <button type="button" onclick="toggleSuggestedCategory('${safeCat}')"
                        class="key-press px-2.5 py-1 rounded-md text-xs font-mono-code font-bold flex items-center gap-1 transition border ${
                            isSelected
                                ? 'bg-accent/15 text-accent border-accent/40'
                                : 'theme-input theme-muted border-transparent opacity-75 hover:opacity-100'
                        }">
                        <span>${isSelected ? '✓' : '+'}</span>
                        <span>${catName}</span>
                        ${isAiRecommended && !isSelected ? '<span class="text-[9px] uppercase opacity-70 ml-0.5">AI</span>' : ''}
                    </button>
                `;
            }).join('');
        }

        function toggleSuggestedCategory(catName) {
            const inputEl = document.getElementById('sheet-cat');
            if (!inputEl) return;
            let cats = inputEl.value.split(',').map(s => s.trim()).filter(Boolean);
            const existingIdx = cats.findIndex(c => c.toLowerCase() === catName.toLowerCase());

            if (existingIdx !== -1) {
                if (cats.length > 1) {
                    cats.splice(existingIdx, 1);
                }
            } else {
                if (cats.length > 0) {
                    const last = cats[cats.length - 1];
                    if (catName.toLowerCase().startsWith(last.toLowerCase()) && last.length < catName.length) {
                        cats[cats.length - 1] = catName;
                    } else {
                        cats.push(catName);
                    }
                } else {
                    cats.push(catName);
                }
            }
            inputEl.value = cats.join(', ');
            renderCategorySuggestions();
        }

        function openEditSheet(id) {
            const item = ITEMS.find(x => x.id === id);
            if (!item) return;
            lockBodyScroll();
            editingId = id;
            sheetTempLocked = isItemLocked(item);
            sheetTempFolderPriority = Boolean(item.folderPriority);

            const fav = document.getElementById('sheet-favicon');
            fav.style.background = 'transparent';
            fav.innerHTML = getSiteFaviconHtml(item, 'w-9 h-9', 'w-5 h-5');

            document.getElementById('sheet-domain').textContent = item.domain;
            document.getElementById('sheet-date').textContent = item.date;
            document.getElementById('sheet-url').value = cleanRawUrl(item.url);
            document.getElementById('sheet-title').value = item.title;
            document.getElementById('sheet-note').value = item.note;
            document.getElementById('sheet-cat').value = getItemCats(item).join(', ');
            document.getElementById('sheet-tags').value = (item.tags || []).join(' ');

            syncSheetLockUI();
            syncSheetPriorityUI();
            renderCategorySuggestions();

            const modal = document.getElementById('edit-sheet-modal');
            const panel = document.getElementById('edit-sheet-panel');
            panel.style.transform = '';
            modal.classList.remove('hidden');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('open'), 10);
        }

        function closeEditSheet() {
            const modal = document.getElementById('edit-sheet-modal');
            const panel = document.getElementById('edit-sheet-panel');
            modal.classList.remove('open');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.style.display = 'none';
                panel.style.transform = '';
                unlockBodyScrollIfNoneOpen();
            }, 340);
            editingId = null;
        }

        function regenerateAINote() {
            const item = ITEMS.find(x => x.id === editingId);
            if (!item) return;
            const currentUrl = cleanRawUrl(document.getElementById('sheet-url').value || item.url);
            const currentTitle = document.getElementById('sheet-title').value.trim();
            const smart = buildSmartAIItem(currentUrl, currentTitle);
            document.getElementById('sheet-note').value = smart.note;
            document.getElementById('sheet-cat').value = (smart.aiSuggestedCats || [smart.cat]).join(', ');
            document.getElementById('sheet-tags').value = smart.tags.join(' ');
            renderCategorySuggestions();
        }

        function saveSheet() {
            const item = ITEMS.find(x => x.id === editingId);
            if (!item) return;
            const newUrl = cleanRawUrl(document.getElementById('sheet-url').value);
            if (newUrl) {
                item.url = newUrl;
                item.domain = newUrl.replace(/^https?:\/\//i, '').replace(/^www\./i, '').split('/')[0].toLowerCase();
            }
            item.title = document.getElementById('sheet-title').value.trim() || item.title;
            item.note = document.getElementById('sheet-note').value.trim() || item.note;

            const parsedCats = document.getElementById('sheet-cat').value
                .split(',')
                .map(c => c.trim())
                .filter(Boolean);
            if (parsedCats.length > 0) {
                item.cats = Array.from(new Set(parsedCats));
                item.cat = item.cats[0];
            }

            const rawTags = document.getElementById('sheet-tags').value.trim();
            if (rawTags) {
                item.tags = rawTags.split(/\s+/).map(tg => tg.startsWith('#') ? tg : `#${tg}`);
            }

            item.lockedOverride = sheetTempLocked;
            item.folderPriority = sheetTempFolderPriority;

            saveStateToStorage();
            closeEditSheet();
            renderApp();
            showToast(t('saved'));
        }

        function deleteCurrentItem() {
            ITEMS = ITEMS.filter(x => x.id !== editingId);
            saveStateToStorage();
            closeEditSheet();
            renderApp();
            showToast(t('deleted'));
        }

        function attachSheetDrag(handleId, panelId, closeFn) {
            const handle = document.getElementById(handleId);
            const panel = document.getElementById(panelId);
            if (!handle || !panel) return;
            let startY = 0, currentY = 0, dragging = false;

            function onStart(e) {
                dragging = true;
                startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                panel.style.transition = 'none';
            }
            function onMove(e) {
                if (!dragging) return;
                currentY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                const diff = currentY - startY;
                if (diff > 0) panel.style.transform = `translateY(${diff}px)`;
            }
            function onEnd() {
                if (!dragging) return;
                dragging = false;
                panel.style.transition = 'transform 0.34s cubic-bezier(0.16, 1, 0.3, 1)';
                if (currentY - startY > 90) closeFn();
                else panel.style.transform = 'translateY(0)';
                startY = 0; currentY = 0;
            }

            handle.addEventListener('mousedown', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);

            handle.addEventListener('touchstart', onStart, { passive: true });
            window.addEventListener('touchmove', onMove, { passive: true });
            window.addEventListener('touchend', onEnd);
        }

        function setupPWA() {
            const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M 43 48 L 58 43 L 58 18 C 69 18 76 23 76 31 C 76 39 68 44 43 52 Z" fill="#1F1D1E"/><path d="M 43 60 L 57 55 L 57 83 C 69 83 77 78 77 70 C 77 62 68 58 55 58 Z" fill="#1F1D1E"/><path d="M 6 6 L 22 22 L 22 68 C 22 77 27 83 36 83 C 45 83 51 77 54 62 L 58 75 C 53 89 43 95 29 95 C 14 95 6 83 6 65 Z" fill="#1F1D1E"/><path d="M 43 45 L 43 22 C 43 10 53 5 67 5 C 83 5 94 14 94 28 C 94 41 82 49 57 57 C 35 64 24 71 21 79" fill="none" stroke="#DF6D27" stroke-width="14" stroke-linecap="butt"/><path d="M 63 54 C 83 54 95 62 95 74 C 95 86 82 95 60 95" fill="none" stroke="#DF6D27" stroke-width="14" stroke-linecap="butt"/><path d="M 6 58 C 6 82 20 95 40 95 C 54 95 62 84 62 62" fill="none" stroke="#DF6D27" stroke-width="13" stroke-linecap="butt"/></svg>`;
            const iconUrl = 'data:image/svg+xml;utf8,' + encodeURIComponent(svgIcon);

            const manifest = {
                name: 'LinkBox // Smart Link Organizer',
                short_name: 'LinkBox',
                description: 'Розумний ІІ-органайзер посилань та нотаток',
                start_url: window.location.href,
                display: 'standalone',
                orientation: 'portrait',
                background_color: '#F3F4F7',
                theme_color: '#F3F4F7',
                icons: [
                    { src: iconUrl, sizes: '192x192', type: 'image/svg+xml', purpose: 'any maskable' },
                    { src: iconUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }
                ]
            };

            const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
            const manifestEl = document.getElementById('pwa-manifest');
            if (manifestEl) {
                manifestEl.setAttribute('href', URL.createObjectURL(manifestBlob));
            }
        }

        window.onload = () => {
            setupPWA();
            const hadSaved = loadStateFromStorage();
            updateStaticTexts();
            setThemeMode(themeMode || 'light');
            const initialMode = hadSaved ? viewMode : (window.innerWidth >= 1024 ? 'large' : 'small');
            setLayoutMode(initialMode);
            setSortMode(sortMode || 'newest');
            attachSidebarSwipe();
            attachSidebarOpenSwipe();
            attachSheetDrag('cats-drag-handle', 'cats-sheet-panel', closeCategoriesSheet);
            attachSheetDrag('tags-drag-handle', 'tags-sheet-panel', closeTagsSheet);
            attachSheetDrag('about-drag-handle', 'about-sheet-panel', closeAboutSheet);
            attachSheetDrag('edit-drag-handle', 'edit-sheet-panel', closeEditSheet);
            if (navigator.onLine) {
                processOfflineQueue(false);
            }
        };
    </script>
</body>
</html>
