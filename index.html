<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ECEAE4" id="meta-theme-color">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="application-name" content="LinkBox">
    <title>LinkBox // Smart Link Organizer</title>
    <link rel="manifest" id="pwa-manifest">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* 1. СВЕТЛАЯ ТЕМА ПО УМОЛЧАНИЮ */
        :root {
            --bg-body: #ECEAE4;
            --text-main: #141413;
            --text-muted: #6E6B64;
            --bg-surface: #F6F4EE;
            --bg-header: rgba(236, 234, 228, 0.94);
            --border-main: #D6D3C9;
            --bg-input: #E2E0D8;
            --bg-card: #FAF9F5;
            --icon-stroke: #141413;
        }

        /* 2. ТЁМНАЯ ТЕМА: Мягкий сланец («золотая середина») */
        body[data-theme="dim"] {
            --bg-body: #2C2C28;
            --text-main: #F5F2EB;
            --text-muted: #B0ACA2;
            --bg-surface: #363631;
            --bg-header: rgba(44, 44, 40, 0.94);
            --border-main: #484842;
            --bg-input: #242420;
            --bg-card: #383833;
            --icon-stroke: #F5F2EB;
        }

        /* 3. ЧЁРНАЯ ТЕМА (AMOLED) */
        body[data-theme="oled"] {
            --bg-body: #0A0A09;
            --text-main: #F2EFE9;
            --text-muted: #827F78;
            --bg-surface: #141412;
            --bg-header: rgba(10, 10, 9, 0.95);
            --border-main: #242420;
            --bg-input: #1C1C19;
            --bg-card: #141412;
            --icon-stroke: #F2EFE9;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
            user-select: none;
            transition: background-color 0.2s ease, color 0.2s ease;
            padding-bottom: calc(4.5rem + env(safe-area-inset-bottom, 0px));
            overscroll-behavior-y: none;
        }
        /* Жёсткая блокировка скролла фона при открытой шторке */
        body.sheet-locked {
            overflow: hidden !important;
            touch-action: none;
        }

        .font-mono-code { font-family: 'JetBrains Mono', monospace; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .theme-surface { background-color: var(--bg-surface); border-color: var(--border-main); }
        .theme-header { background-color: var(--bg-header); border-color: var(--border-main); }
        .theme-input { background-color: var(--bg-input); color: var(--text-main); }
        .theme-card { background-color: var(--bg-card); border-color: var(--border-main); }
        .theme-muted { color: var(--text-muted); }

        /* Строгие минималистичные иконки одной линией */
        .mono-icon {
            stroke: var(--icon-stroke);
            fill: none;
            stroke-width: 1.75;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .key-press { transition: transform 0.12s ease, opacity 0.12s ease; }
        .key-press:active { transform: scale(0.97); }

        /* Плавные шторки снизу со стягиванием пальцем */
        .sheet-backdrop {
            transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
            overscroll-behavior: contain;
        }
        .sheet-panel {
            transform: translateY(100%);
            transition: transform 0.34s cubic-bezier(0.16, 1, 0.3, 1);
            overscroll-behavior: contain;
        }
        .sheet-backdrop.open { opacity: 1; }
        .sheet-backdrop.open .sheet-panel { transform: translateY(0); }
    </style>
</head>
<body class="min-h-screen">

    <!-- ШАПКА: Нажатие на логотип и название сбрасывает все фильтры и возвращает ко ВСЕМ ссылкам -->
    <header class="sticky top-0 z-40 theme-header backdrop-blur-md border-b px-4 py-3">
        <div class="max-w-4xl mx-auto flex items-center justify-between gap-3">
            
            <!-- Левый блок: Кнопка Домой (Логотип + Название + Количество ссылок) -->
            <div onclick="resetToAllLinks()" title="Показати всі посилання" class="key-press flex items-center gap-3 min-w-0 cursor-pointer">
                <div class="w-10 h-10 rounded-lg bg-[#141413] flex items-center justify-center shrink-0 p-1.5">
                    <svg viewBox="0 0 100 100" class="w-full h-full">
                        <circle cx="50" cy="50" r="37" fill="none" stroke="#D96B27" stroke-width="11"/>
                        <path d="M 16 64 Q 24 77 38 82" fill="none" stroke="#F6F4EE" stroke-width="11"/>
                        <path d="M 84 36 Q 76 23 62 18" fill="none" stroke="#F6F4EE" stroke-width="11"/>
                        <circle cx="50" cy="50" r="30.5" fill="none" stroke="#141413" stroke-width="3.5"/>
                        <circle cx="50" cy="50" r="23" fill="none" stroke="#F6F4EE" stroke-width="11"/>
                        <path d="M 29 40 A 23 23 0 0 0 45 72" fill="none" stroke="#D96B27" stroke-width="11" stroke-linecap="round"/>
                        <path d="M 71 60 A 23 23 0 0 0 55 28" fill="none" stroke="#D96B27" stroke-width="11" stroke-linecap="round"/>
                        <circle cx="50" cy="50" r="16.5" fill="#141413"/>
                    </svg>
                </div>
                <div class="flex items-center gap-2 min-w-0">
                    <h1 class="text-lg sm:text-xl font-black tracking-tight uppercase truncate">LinkBox</h1>
                    <span id="total-count-pill" class="text-xs font-mono-code font-bold px-2 py-0.5 rounded-md bg-[#D96B27] text-white shrink-0">
                        6
                    </span>
                    <span id="active-filter-pill" class="hidden text-[11px] font-mono-code font-bold px-2 py-0.5 rounded-md theme-input truncate max-w-[130px] sm:max-w-[200px]"></span>
                </div>
            </div>

            <!-- Правый блок: Кнопка массового выбора + Кнопка Меню -->
            <div class="flex items-center gap-2 shrink-0">
                <button onclick="toggleSelectMode()" id="select-mode-btn" title="Масовий вибір та видалення" class="key-press w-10 h-10 rounded-lg theme-input flex items-center justify-center transition">
                    <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24">
                        <polyline points="9 11 12 14 22 4"/>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                    </svg>
                </button>
                <button onclick="openMenuSheet()" class="key-press h-10 px-4 rounded-lg theme-input flex items-center gap-2 font-bold text-sm hover:opacity-90 transition">
                    <svg class="w-5 h-5 mono-icon" viewBox="0 0 24 24">
                        <line x1="3" y1="7" x2="21" y2="7"/>
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="17" x2="15" y2="17"/>
                    </svg>
                    <span id="btn-menu-label">Меню</span>
                </button>
            </div>

        </div>
    </header>

    <!-- ГЛАВНЫЙ КОНТЕЙНЕР -->
    <main class="max-w-4xl mx-auto px-4 py-4 space-y-4">

        <!-- Строка ввода ссылок: поле и интуитивная кнопка Додати (с плюсом и AI-искрой) -->
        <div class="flex items-stretch gap-2">
            <input id="url-input" type="text" onkeydown="if(event.key==='Enter') addLinkByAI()" placeholder="Вставте посилання або список посилань..." class="flex-1 theme-card border rounded-lg px-4 py-3 text-base outline-none font-medium focus:border-[#D96B27] transition">
            <button onclick="addLinkByAI()" title="Розумне додавання посилання" class="key-press bg-[#D96B27] hover:bg-[#c55d1d] text-white font-black text-sm px-4 sm:px-5 rounded-lg flex items-center justify-center gap-2 shrink-0 shadow-xs">
                <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none">
                    <!-- Чёткий жирный плюс (добавление) -->
                    <path d="M11 5v14M4 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                    <!-- Аккуратная искра ИИ в правом верхнем углу -->
                    <path d="M19 2.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2z" fill="currentColor"/>
                </svg>
                <span id="btn-add-label">Додати</span>
            </button>
        </div>

        <!-- Панель массового выбора и удаления (появляется только в режиме выбора) -->
        <div id="bulk-action-bar" class="hidden theme-card border border-[#D96B27] rounded-xl p-3 items-center justify-between gap-2">
            <div class="flex items-center gap-2">
                <button onclick="selectAllVisible()" class="key-press px-3 py-1.5 rounded-lg theme-input text-xs font-bold" id="btn-select-all">
                    Вибрати всі
                </button>
                <span id="selected-count-label" class="text-xs font-mono-code font-bold theme-muted">0 вибрано</span>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="deleteSelectedItems()" class="key-press px-3.5 py-1.5 rounded-lg bg-rose-500 text-white text-xs font-extrabold" id="btn-delete-selected">
                    Видалити вибрані
                </button>
                <button onclick="toggleSelectMode()" class="key-press px-3 py-1.5 rounded-lg theme-input text-xs font-bold" id="btn-cancel-select">
                    Скасувати
                </button>
            </div>
        </div>

        <!-- Карточки -->
        <div id="cards-container">
            <!-- Заполняется через JS -->
        </div>

    </main>

    <!-- ШТОРКА «МЕНЮ» -->
    <div id="menu-sheet-modal" onclick="if(event.target===this) closeMenuSheet()" class="sheet-backdrop fixed inset-0 bg-black/60 z-50 hidden items-end justify-center p-0 sm:p-4">
        <div id="menu-sheet-panel" class="sheet-panel theme-surface w-full max-w-md rounded-t-2xl sm:rounded-xl p-5 border-t sm:border space-y-5 max-h-[88vh] overflow-y-auto">
            
            <!-- Полосочка для стягивания вниз -->
            <div id="menu-drag-handle" class="w-12 h-2 bg-stone-400/50 rounded-full mx-auto -mt-1 cursor-grab active:cursor-grabbing touch-none"></div>
            
            <!-- Шапка Меню -->
            <div class="flex items-center justify-between">
                <span class="font-black text-base uppercase tracking-tight" id="menu-title-label">Меню</span>
                <button onclick="closeMenuSheet()" class="key-press w-9 h-9 rounded-lg theme-input flex items-center justify-center">
                    <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- СТРОКА 1: Поиск + Кнопка Рандомайзера -->
            <div class="flex items-stretch gap-2">
                <div class="flex-1 flex items-center theme-input rounded-lg px-3.5 py-2.5">
                    <svg class="w-4 h-4 mono-icon mr-2.5 shrink-0 opacity-70" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/>
                    </svg>
                    <input id="search-input" oninput="renderApp()" type="text" placeholder="Пошук..." class="w-full bg-transparent text-sm sm:text-base outline-none font-medium">
                </div>
                <button onclick="openRandomLink()" title="Випадкове посилання" class="key-press px-4 rounded-lg theme-input flex items-center justify-center gap-2 font-bold text-xs hover:opacity-80 shrink-0">
                    <svg class="w-5 h-5 mono-icon" viewBox="0 0 24 24">
                        <polyline points="16 3 21 3 21 8"/>
                        <line x1="4" y1="20" x2="21" y2="3"/>
                        <polyline points="21 16 21 21 16 21"/>
                        <line x1="15" y1="15" x2="21" y2="21"/>
                        <line x1="4" y1="4" x2="9" y2="9"/>
                    </svg>
                    <span id="btn-random-label">Рандом</span>
                </button>
            </div>

            <!-- СТРОКА 2: Раскладка и Тема -->
            <div class="grid grid-cols-12 gap-2">
                <!-- Переключатель вида (7 колонок) -->
                <div class="col-span-7 grid grid-cols-3 gap-1 p-1 rounded-lg theme-input">
                    <button onclick="setLayoutMode('small')" id="layout-small-btn" title="Малі картки" class="key-press py-2 rounded-md flex items-center justify-center gap-1.5 text-xs font-bold transition">
                        <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                    </button>
                    <button onclick="setLayoutMode('large')" id="layout-large-btn" title="Великі картки" class="key-press py-2 rounded-md flex items-center justify-center gap-1.5 text-xs font-bold transition">
                        <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6"/><rect x="3" y="14" width="18" height="6"/></svg>
                    </button>
                    <button onclick="setLayoutMode('list')" id="layout-list-btn" title="Список" class="key-press py-2 rounded-md flex items-center justify-center gap-1.5 text-xs font-bold transition">
                        <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                    </button>
                </div>

                <!-- Переключатель тем (5 колонок) -->
                <div class="col-span-5 grid grid-cols-3 gap-1 p-1 rounded-lg theme-input">
                    <button onclick="setThemeMode('light')" id="theme-light-btn" title="Світла тема" class="key-press py-2 rounded-md flex items-center justify-center transition">
                        <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="4"/>
                            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                        </svg>
                    </button>
                    <button onclick="setThemeMode('dim')" id="theme-dim-btn" title="Темна тема" class="key-press py-2 rounded-md flex items-center justify-center transition">
                        <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                    <button onclick="setThemeMode('device')" id="theme-device-btn" title="AMOLED" class="key-press py-2 rounded-md flex items-center justify-center transition">
                        <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="8"/>
                            <path d="M12 4a8 8 0 0 0 0 16Z" fill="currentColor" stroke="none"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- СТРОКА 3: ПАПКИ / КАТЕГОРИИ -->
            <div class="space-y-2">
                <div class="flex items-center justify-between">
                    <span class="text-[11px] font-mono-code font-bold uppercase theme-muted" id="lbl-folders-section">Категорії</span>
                </div>
                <div id="folders-grid" class="grid grid-cols-2 gap-1.5 max-h-56 overflow-y-auto overscroll-contain pr-0.5">
                    <!-- Заполняется через JS -->
                </div>
            </div>

            <!-- СТРОКА 4: ИИ-Импорт, Экспорт, Кнопка # (между Експорт и UA), язык и фирменная иконка Автора/Справки -->
            <div class="flex items-center gap-2 pt-3 border-t border-black/10">
                <input id="ai-import-file" type="file" accept=".html,.htm,.txt,.json,.csv" class="hidden" onchange="handleAIFileImport(event)">
                <button onclick="triggerAIFileImport()" class="key-press flex-1 py-2.5 px-3 rounded-lg bg-[#D96B27] text-white text-xs font-black flex items-center justify-center gap-1.5">
                    <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <span id="btn-import-ai" class="truncate">Імпорт ІІ</span>
                </button>
                <button onclick="exportBrowserBookmarks()" class="key-press flex-1 py-2.5 px-3 rounded-lg theme-input text-xs font-bold flex items-center justify-center gap-1.5">
                    <svg class="w-4 h-4 mono-icon shrink-0" viewBox="0 0 24 24">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    <span id="btn-export-html" class="truncate">Експорт</span>
                </button>
                <!-- Аккуратная кнопка # между Експорт и UA -->
                <button onclick="openTagsSheetFromMenu()" title="Усі хештеги #" class="key-press w-9 h-9 rounded-lg theme-input text-xs font-mono-code font-black flex items-center justify-center hover:text-[#D96B27] transition shrink-0">
                    #
                </button>
                <button onclick="toggleLang()" id="lang-btn" class="key-press h-9 px-3 rounded-lg theme-input text-xs font-mono-code font-bold flex items-center justify-center shrink-0">
                    UA
                </button>
                <!-- Фирменная векторная иконка «О приложении / Авторские права» за кнопкой UA -->
                <button onclick="openAboutSheetFromMenu()" title="Про додаток та автора" class="key-press w-9 h-9 rounded-lg theme-input flex items-center justify-center hover:text-[#D96B27] transition shrink-0">
                    <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <path d="M12 8h.01"/>
                        <path d="M11 12h1v4h1"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- ШТОРКА «#ХЕШТЕГИ» -->
    <div id="tags-sheet-modal" onclick="if(event.target===this) closeTagsSheet()" class="sheet-backdrop fixed inset-0 bg-black/60 z-50 hidden items-end justify-center p-0 sm:p-4">
        <div id="tags-sheet-panel" class="sheet-panel theme-surface w-full max-w-md rounded-t-2xl sm:rounded-xl p-5 border-t sm:border space-y-4 max-h-[85vh] overflow-y-auto">
            
            <div id="tags-drag-handle" class="w-12 h-2 bg-stone-400/50 rounded-full mx-auto -mt-1 cursor-grab active:cursor-grabbing touch-none"></div>
            
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="w-7 h-7 rounded-lg bg-[#D96B27] text-white font-mono-code font-black text-sm flex items-center justify-center">#</span>
                    <span class="font-black text-base uppercase tracking-tight" id="tags-sheet-title">Хештеги</span>
                </div>
                <button onclick="closeTagsSheet()" class="key-press w-9 h-9 rounded-lg theme-input flex items-center justify-center">
                    <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <div id="tags-cloud-container" class="flex flex-wrap gap-2 max-h-80 overflow-y-auto overscroll-contain py-1">
                <!-- Заполняется через JS -->
            </div>
        </div>
    </div>

    <!-- ШТОРКА «ПРО ДОДАТОК / АВТОРСЬКІ ПРАВА» -->
    <div id="about-sheet-modal" onclick="if(event.target===this) closeAboutSheet()" class="sheet-backdrop fixed inset-0 bg-black/60 z-50 hidden items-end justify-center p-0 sm:p-4">
        <div id="about-sheet-panel" class="sheet-panel theme-surface w-full max-w-md rounded-t-2xl sm:rounded-xl p-5 border-t sm:border space-y-4 max-h-[88vh] overflow-y-auto">
            
            <!-- Полосочка для стягивания вниз -->
            <div id="about-drag-handle" class="w-12 h-2 bg-stone-400/50 rounded-full mx-auto -mt-1 cursor-grab active:cursor-grabbing touch-none"></div>
            
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <span class="w-8 h-8 rounded-lg bg-[#D96B27] text-white flex items-center justify-center shrink-0">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                            <path d="M12 8h.01"/>
                            <path d="M11 12h1v4h1"/>
                        </svg>
                    </span>
                    <span class="font-black text-base uppercase tracking-tight" id="about-sheet-title">Як усе влаштовано</span>
                </div>
                <button onclick="closeAboutSheet()" class="key-press w-9 h-9 rounded-lg theme-input flex items-center justify-center">
                    <svg class="w-4 h-4 mono-icon" viewBox="0 0 24 24">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Контент гида и авторский блок (переводится UA / EN) -->
            <div id="about-sheet-body" class="space-y-3 text-sm leading-relaxed overflow-y-auto overscroll-contain pr-0.5">
                <!-- Заполняется через JS -->
            </div>
        </div>
    </div>

    <!-- ШТОРКА РЕДАКТИРОВАНИЯ КАРТОЧКИ -->
    <div id="edit-sheet-modal" onclick="if(event.target===this) closeEditSheet()" class="sheet-backdrop fixed inset-0 bg-black/60 z-50 hidden items-end justify-center p-0 sm:p-4">

        // Жёсткая очистка URL от запятых, точек, скобок и мусора на конце
        function cleanRawUrl(raw) {
            let u = (raw || '').trim();
            u = u.replace(/^[,\s"'<>()[\]{};:]+|[,\s"'<>()[\]{}.;:]+$/g, '');
            if (!u) return '';
            if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
            return u;
        }

        function saveStateToStorage() {
            try {
                const payload = {
                    items: ITEMS,
                    lockedFolders: Array.from(LOCKED_FOLDERS),
                    themeMode,
                    viewMode,
                    currentLang
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
            } catch (e) {}
        }

        function loadStateFromStorage() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('linkbox_hyperos_v1');
                if (!raw) return false;
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed.items)) {
                    ITEMS = parsed.items.map(it => {
                        const cleanedUrl = cleanRawUrl(it.url);
                        const isGenericClone = /Інформаційний портал .* актуальні новини|Проаналізовано ІІ/i.test(it.note || '');
                        if (isGenericClone) {
                            const customT = (!it.title || /Новини та аналітика|Корисний ресурс/i.test(it.title)) ? '' : it.title;
                            const rebuilt = buildSmartAIItem(cleanedUrl, customT);
                            return {
                                ...rebuilt,
                                id: it.id,
                                date: it.date || rebuilt.date,
                                lockedOverride: it.lockedOverride ?? null
                            };
                        }
                        return {
                            ...it,
                            url: cleanedUrl
                        };
                    });
                }
                if (Array.isArray(parsed.lockedFolders)) LOCKED_FOLDERS = new Set(parsed.lockedFolders);
                if (parsed.themeMode) themeMode = parsed.themeMode;
                if (parsed.viewMode) viewMode = parsed.viewMode;
                if (parsed.currentLang) currentLang = parsed.currentLang;
                return true;
            } catch (e) {
                return false;
            }
        }

        function openExternalUrlInNewTab(rawUrl) {
            const finalUrl = cleanRawUrl(rawUrl);
            if (!finalUrl) return;

            const a = document.createElement('a');
            a.href = finalUrl;
            a.target = '_blank';
            a.rel = 'noopener noreferrer external';
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                if (a.parentNode) a.parentNode.removeChild(a);
            }, 150);
        }

        function lockBodyScroll() {
            document.body.classList.add('sheet-locked');
        }

        function unlockBodyScrollIfNoneOpen() {
            const menuOpen = document.getElementById('menu-sheet-modal').classList.contains('open');
            const editOpen = document.getElementById('edit-sheet-modal').classList.contains('open');
            const tagsOpen = document.getElementById('tags-sheet-modal').classList.contains('open');
            const aboutOpen = document.getElementById('about-sheet-modal').classList.contains('open');
            if (!menuOpen && !editOpen && !tagsOpen && !aboutOpen) {
                document.body.classList.remove('sheet-locked');
            }
        }

        function resetToAllLinks() {
            const hadFilter = selectedFolder !== 'ALL' || selectedTag !== null || (document.getElementById('search-input')?.value || '') !== '';
            selectedFolder = 'ALL';
            selectedTag = null;
            const searchEl = document.getElementById('search-input');
            if (searchEl) searchEl.value = '';
            if (isSelectMode) {
                isSelectMode = false;
                selectedIds.clear();
                updateBulkBarUI();
            }
            renderApp();
            if (hadFilter) showToast(t('homeReset'));
        }

        function toggleSelectMode() {
            isSelectMode = !isSelectMode;
            selectedIds.clear();
            updateBulkBarUI();
            renderApp();
        }

        function updateBulkBarUI() {
            const bar = document.getElementById('bulk-action-bar');
            const btn = document.getElementById('select-mode-btn');
            const countLbl = document.getElementById('selected-count-label');
            if (isSelectMode) {
                bar.classList.remove('hidden');
                bar.classList.add('flex');
                btn.className = 'key-press w-10 h-10 rounded-lg bg-[#D96B27] text-white flex items-center justify-center transition';
                countLbl.textContent = `${selectedIds.size} ${t('selectedCount')}`;
            } else {
                bar.classList.add('hidden');
                bar.classList.remove('flex');
                btn.className = 'key-press w-10 h-10 rounded-lg theme-input flex items-center justify-center transition';
            }
        }

        function toggleCardSelect(id, e) {
            if (e) e.stopPropagation();
            if (selectedIds.has(id)) selectedIds.delete(id);
            else selectedIds.add(id);
            updateBulkBarUI();
            renderApp();
        }

        function getFilteredItems() {
            const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
            let filtered = selectedFolder === 'ALL' ? ITEMS : ITEMS.filter(i => i.cat === selectedFolder);
            if (selectedTag) {
                filtered = filtered.filter(i => Array.isArray(i.tags) && i.tags.some(tg => tg.toLowerCase() === selectedTag.toLowerCase()));
            }
            if (q) {
                filtered = filtered.filter(i =>
                    [i.name, i.domain, i.title, i.cat, i.note, ...(i.tags || [])].join(' ').toLowerCase().includes(q)
                );
            }
            return filtered;
        }

        function selectAllVisible() {
            const visible = getFilteredItems();
            const allSelected = visible.length > 0 && visible.every(i => selectedIds.has(i.id));
            if (allSelected) {
                visible.forEach(i => selectedIds.delete(i.id));
            } else {
                visible.forEach(i => selectedIds.add(i.id));
            }
            updateBulkBarUI();
            renderApp();
        }

        function deleteSelectedItems() {
            if (selectedIds.size === 0) return;
            const removedCount = selectedIds.size;
            ITEMS = ITEMS.filter(i => !selectedIds.has(i.id));
            selectedIds.clear();
            isSelectMode = false;
            updateBulkBarUI();
            saveStateToStorage();
            renderApp();
            showToast(t('bulkDeleted') + removedCount);

        function renderTagsCloud() {
            const tagCounts = new Map();
            ITEMS.forEach(item => {
                (item.tags || []).forEach(rawTag => {
                    const clean = rawTag.trim();
                    if (!clean) return;
                    const key = clean.toLowerCase();
                    const prev = tagCounts.get(key) || { label: clean, count: 0 };
                    prev.count += 1;
                    tagCounts.set(key, prev);
                });
            });

            const container = document.getElementById('tags-cloud-container');
            const sorted = Array.from(tagCounts.values()).sort((a, b) => b.count - a.count);

            let html = `
                <button onclick="selectTagAndClose(null)" class="key-press px-3.5 py-2 rounded-lg text-xs font-mono-code font-bold flex items-center gap-2 transition ${
                    selectedTag === null ? 'bg-[#D96B27] text-white' : 'theme-input'
                }">
                    <span>${t('allFolders')}</span>
                    <span class="opacity-75">${ITEMS.length}</span>
                </button>
            `;

            html += sorted.map(tObj => {
                const isAct = selectedTag && selectedTag.toLowerCase() === tObj.label.toLowerCase();
                return `
                    <button onclick="selectTagAndClose('${tObj.label.replace(/'/g, "\\'")}')" class="key-press px-3.5 py-2 rounded-lg text-xs font-mono-code font-bold flex items-center gap-1.5 transition ${
                        isAct ? 'bg-[#D96B27] text-white' : 'theme-input'
                    }">
                        <span>${tObj.label}</span>
                        <span class="text-[10px] opacity-70 px-1.5 py-0.2 rounded bg-black/10">${tObj.count}</span>
                    </button>
                `;
            }).join('');

            container.innerHTML = html;
        }

            const grid = document.getElementById('folders-grid');

            let html = `

            html += cats.map(c => {

        function copyItemUrl(url, e) {

            document.execCommand('copy');
            document.body.removeChild(temp);

            const foldersMap = {};
            ITEMS.forEach(item => {

                foldersMap[item.cat].push(item);
            });
            const nowUnix = Math.floor(Date.now() / 1000);
            let html = `<!DOCTYPE NETSCAPE-Bookmark-file-1><META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8"><TITLE>LinkBox Bookmarks</TITLE><H1>LinkBox</H1><DL><p>\n`;
            Object.keys(foldersMap).forEach(cat => {
                html += `    <DT><H3 ADD_DATE="${nowUnix}">${cat}</H3>\n    <DL><p>\n`;
                foldersMap[cat].forEach(item => {
                    html += `        <DT><A HREF="${cleanRawUrl(item.url)}" ADD_DATE="${nowUnix}">${item.name} — ${item.title}</A>\n<DD>${item.note}\n`;
                });
                html += `    </DL><p>\n`;
            });
            html += `</DL><p>\n`;

            const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `linkbox_bookmarks.html`;

        function normalizeUrlForCompare(raw) {
            return cleanRawUrl(raw).replace(/^https?:\/\//i, '').replace(/^www\./i, '').replace(/\/+$/, '').toLowerCase();
        }

        function findDuplicateItem(rawUrl) {
            const target = normalizeUrlForCompare(rawUrl);
            if (!target) return null;
            return ITEMS.find(item => normalizeUrlForCompare(item.url) === target) || null;
        }

        function extractCleanBrandName(domain) {
            const parts = domain.split('.').filter(p => !['www', 'm', 'mobile', 'ua', 'com', 'net', 'org', 'gov', 'edu', 'info', 'io', 'co', 'uk', 'ru', 'biz'].includes(p));
            const root = parts.length > 0 ? parts[parts.length - 1] : domain.split('.')[0];
            if (!root) return 'Сайт';
            const mainBrand = root.charAt(0).toUpperCase() + root.slice(1);
            if (parts.length > 1) {
                const sub = parts[0].toLowerCase();
                const subMap = {
                    techno: 'Techno',
                    life: 'Life',
                    sport: 'Sport',
                    auto: 'Auto',
                    health: 'Health',
                    style: 'Style',
                    travel: 'Travel',
                    music: 'Music',
                    books: 'Books'
                };
                if (subMap[sub]) return `${mainBrand} ${subMap[sub]}`;
            }
            return mainBrand;
        }

        function decodeUrlPathToHumanTopic(urlStr) {
            try {
                const u = new URL(cleanRawUrl(urlStr));
                const segments = u.pathname.split('/').filter(Boolean);
                if (segments.length === 0) return { topic: '', sectionHint: '' };

                let slug = decodeURIComponent(segments[segments.length - 1]);
                slug = slug.replace(/\.(html?|php|aspx?|jsp)$/i, '');
                slug = slug.replace(/(?:^|[-_])\d{4,}(?=$|[-_])/g, '');
                slug = slug.replace(/^\d+[-_]/, '');

                const sectionRaw = segments.length > 1 ? segments.slice(0, -1).join(' ').toLowerCase() : '';

                const words = slug.split(/[-_]+/).filter(w => w.length > 0 && !/^\d+$/.test(w));
                if (words.length < 2) return { topic: '', sectionHint: sectionRaw };

                if (/[а-яіїєґ]/i.test(slug)) {
                    const cleanCyr = words.join(' ');
                    return {
                        topic: cleanCyr.charAt(0).toUpperCase() + cleanCyr.slice(1),
                        sectionHint: sectionRaw
                    };
                }

                const SLUG_DICT = {
                    'luchshih': 'лучших', 'luchshie': 'лучшие', 'samye': 'самые', 'samyh': 'самых',
                    'nauchno': 'научно', 'fantasticheskih': 'фантастических', 'romanov': 'романов',
                    'knig': 'книг', 'knigi': 'книги', 'xxi': 'XXI', 'veka': 'века', 'chtivo': 'чтиво',
                    'voskresnoje': 'воскресное', 'smeshnye': 'смешные', 'zagolovki': 'заголовки',
                    'ukrainskiy': 'украинский', 'ukrainskie': 'украинские', 'shou': 'шоу', 'biz': 'биз',
                    'memy': 'мемы', 'pro': 'про', 'literaturu': 'литературу', 'veselye': 'весёлые',
                    'kanaly': 'каналы', 'telegram': 'Telegram', 'vybor': 'выбор', 'redakcii': 'редакции',
                    'kakie': 'какие', 'sajty': 'сайты', 'rabotayut': 'работают', 'ukraine': 'Украине',
                    'ukraina': 'Украина', 'besplatno': 'бесплатно', 'onlajn': 'онлайн', 'smotret': 'смотреть',
                    'serialy': 'сериалы', 'filmy': 'фильмы', 'kino': 'кино', 'novosti': 'новости',
                    'tehnologii': 'технологии', 'gadzhety': 'гаджеты', 'smartfony': 'смартфоны',
                    'obzor': 'обзор', 'reyting': 'рейтинг', 'top': 'ТОП', 'kak': 'как', 'chto': 'что',
                    'gde': 'где', 'kogda': 'когда', 'pochemu': 'почему', 'sovety': 'советы',
                    'instrukciya': 'инструкция', 'recepty': 'рецепты', 'igry': 'игры', 'muzyka': 'музыка',
                    'nauka': 'наука', 'kosmos': 'космос', 'istoriya': 'история', 'ekonomika': 'экономика',
                    'biznes': 'бизнес', 'kriptovalyuta': 'криптовалюта', 'kurs': 'курс', 'valyut': 'валют',
                    'nedorogoy': 'недорогой', 'kupit': 'купить', 'cena': 'цена'
                };

                const isTranslitLike = words.some(w => SLUG_DICT[w.toLowerCase()] || /(shch|zh|kh|ts|ch|sh|yu|ya|iy|yy|oje|aya|yye|ov|ev|ih|yh)$/i.test(w));

                function translitWordToCyr(w) {
                    const low = w.toLowerCase();
                    if (SLUG_DICT[low]) return SLUG_DICT[low];
                    if (['ai', 'ui', 'ux', 'it', 'ios', 'android', 'apk', 'pc', 'tv', 'usb', 'wifi', 'vpn', 'gpt', 'telegram', 'youtube', 'netflix', 'spotify', 'starlink', 'ecoflow'].includes(low)) {
                        return w.toUpperCase() === w ? w : (w.charAt(0).toUpperCase() + w.slice(1));
                    }
                    let s = low
                        .replace(/shch/g, 'щ')
                        .replace(/yo/g, 'ё')
                        .replace(/zh/g, 'ж')
                        .replace(/kh/g, 'х')
                        .replace(/ts/g, 'ц')
                        .replace(/ch/g, 'ч')
                        .replace(/sh/g, 'ш')
                        .replace(/yu/g, 'ю')
                        .replace(/ya/g, 'я')
                        .replace(/je/g, 'е')
                        .replace(/iy/g, 'ий')
                        .replace(/yy/g, 'ый')
                        .replace(/aya/g, 'ая')
                        .replace(/oye/g, 'ое');
                    const map = {
                        a:'а', b:'б', v:'в', g:'г', d:'д', e:'е', z:'з', i:'и', j:'й', y:'й',
                        k:'k', l:'л', m:'м', n:'н', o:'о', p:'п', r:'р', s:'с', t:'т', u:'у',
                        f:'ф', h:'х', c:'ц', w:'в', x:'кс', q:'к'
                    };
                    map.k = 'к';
                    let out = '';
                    for (const ch of s) out += map[ch] || ch;
                    return out;
                }

                const converted = words.slice(0, 11).map(w => isTranslitLike ? translitWordToCyr(w) : w);
                let phrase = converted.join(' ').trim();
                if (phrase) {
                    phrase = phrase.charAt(0).toUpperCase() + phrase.slice(1);
                }
                return { topic: phrase, sectionHint: sectionRaw };
            } catch (e) {
                return { topic: '', sectionHint: '' };
            }
        }

        function sanitizeBookmarkTitle(rawTitle, cleanName) {
            if (!rawTitle) return '';
            let tStr = rawTitle.trim();
            if (/^https?:\/\//i.test(tStr)) return '';
            tStr = tStr.replace(/[,\s]+$/g, '');
            if (/—\s*[a-z0-9_-]+\s+\d{4,}/i.test(tStr)) return '';
            if (tStr.length < 2) return '';
            return tStr;
        }

            else if (/spotify|soundcloud|music\.apple|deezer|bandcamp|last\.fm|shazam|mp3|radio|podcast|audio|музик|музык|пісн|альбом|плейлист/.test(pageTopicSignal)) {

                note = humanTitle

                    : `Аудіострімінг та музичний каталог на платформі ${cleanName} (${domain}).`;

            // 3. КИНО, СЕРИАЛЫ И ВИДЕО
            else if (/youtube|youtu\.be|netflix|megogo|sweet\.tv|takflix|kinopoisk|imdb|vimeo|twitch|rezka|filmix|uaserial|serial|серіал|сериал|кіно|кино|фільм|фильм|мульт|movie|cinema|video/.test(pageTopicSignal)) {
                cat = currentLang === 'uk' ? 'Кіно та Серіали' : 'Movies & Video';

                note = humanTitle
                    ? `Матеріал про кіно та серіали: «${humanTitle}» (${domain}) — збережено на перегляд.`
